<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing OS 2.0</title>
<style>
  /* Design tokens: colors, fonts, timing */
  :root {
    --c-bg: #0a0a0f;
    --c-green: #00ff9d;
    --c-cyan: #00d4ff;
    --c-red: #ff3860;
    --c-dim: #5f7480;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
    --font-sans: system-ui, 'Inter', sans-serif;
  }

  /* Base reset: lock viewport, no scrolling, dark canvas */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--c-bg);
    color: var(--c-green);
    font-family: var(--font-sans);
  }

  /* Faint animated grid background */
  body::before {
    content: "";
    position: fixed;
    inset: -2px;
    background-image:
      linear-gradient(rgba(0, 255, 157, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 157, 0.045) 1px, transparent 1px);
    background-size: 46px 46px;
    animation: gridPan 14s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes gridPan {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 46px 46px, 46px 46px; }
  }

  /* Subtle horizontal scan-line overlay */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(255, 255, 255, 0.05) 0 1px,
      transparent 1px 4px
    );
    opacity: 0.55;
    animation: scanDrift 9s linear infinite;
    pointer-events: none;
    z-index: 2;
  }
  @keyframes scanDrift {
    from { transform: translateY(0); }
    to   { transform: translateY(4px); }
  }

  /* Stage holds all five stacked sections */
  #stage { position: fixed; inset: 0; z-index: 1; }
  .section {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 5vh 4vw;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  /* Shared neon glow for primary text */
  .glow { text-shadow: 0 0 10px currentColor, 0 0 28px currentColor; }

  /* Monospace code-feel labels */
  .mono { font-family: var(--font-mono); letter-spacing: 0.06em; }
  .header {
    font-family: var(--font-mono);
    font-size: clamp(40px, 4.4vw, 64px);
    letter-spacing: 0.12em;
    color: var(--c-cyan);
    margin-bottom: 6vh;
    text-shadow: 0 0 10px currentColor, 0 0 26px currentColor;
  }

  /* Blinking caret used by typewriter lines */
  .caret {
    display: inline-block;
    color: var(--c-green);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* SECTION 1 — title with RGB-split glitch */
  .os-title {
    position: relative;
    font-size: clamp(96px, 11vw, 184px);
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--c-green);
    text-shadow: 0 0 14px currentColor, 0 0 40px currentColor;
  }
  .os-title::before,
  .os-title::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .os-title::before { color: var(--c-cyan); animation: glitchA 2s infinite linear; }
  .os-title::after  { color: var(--c-red);  animation: glitchB 2s infinite linear; }
  @keyframes glitchA {
    0%, 86%, 100% { transform: translate(0); clip-path: inset(0 0 0 0); opacity: 0; }
    88%  { transform: translate(-5px, 2px);  clip-path: inset(8% 0 60% 0); opacity: 0.85; }
    92%  { transform: translate(4px, -2px);  clip-path: inset(50% 0 18% 0); opacity: 0.85; }
    96%  { transform: translate(-3px, 1px);  clip-path: inset(72% 0 6% 0);  opacity: 0.85; }
  }
  @keyframes glitchB {
    0%, 86%, 100% { transform: translate(0); clip-path: inset(0 0 0 0); opacity: 0; }
    88%  { transform: translate(5px, -2px);  clip-path: inset(64% 0 12% 0); opacity: 0.8; }
    92%  { transform: translate(-4px, 2px);  clip-path: inset(20% 0 52% 0); opacity: 0.8; }
    96%  { transform: translate(3px, -1px);  clip-path: inset(40% 0 36% 0); opacity: 0.8; }
  }
  .subtitle {
    margin-top: 5vh;
    font-family: var(--font-mono);
    font-size: clamp(32px, 3.4vw, 48px);
    letter-spacing: 0.16em;
    color: var(--c-cyan);
    text-shadow: 0 0 10px currentColor, 0 0 24px currentColor;
  }

  /* SECTION 2 — detected issues */
  .issue-list { display: flex; flex-direction: column; gap: 4.5vh; }
  .issue {
    font-size: clamp(72px, 7.4vw, 116px);
    font-weight: 800;
    color: var(--c-red);
    text-shadow: 0 0 12px currentColor, 0 0 34px currentColor;
    max-width: 92vw;
    line-height: 1.1;
    visibility: hidden;
  }
  .issue .warn { margin-right: 0.3em; }

  /* SECTION 3 — installing updates */
  .update-list {
    display: flex;
    flex-direction: column;
    gap: 5vh;
    width: min(72vw, 1000px);
  }
  .update-row { visibility: hidden; }
  .update-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: clamp(40px, 4vw, 60px);
    font-weight: 800;
    color: var(--c-green);
    text-shadow: 0 0 10px currentColor, 0 0 26px currentColor;
    margin-bottom: 1.6vh;
  }
  .update-pct { font-family: var(--font-mono); font-size: clamp(28px, 2.6vw, 38px); }
  .update-check { color: var(--c-green); opacity: 0; transition: none; }
  .bar {
    height: 26px;
    border: 2px solid rgba(0, 255, 157, 0.55);
    border-radius: 4px;
    background: rgba(0, 255, 157, 0.06);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: var(--c-green);
    box-shadow: 0 0 14px var(--c-green), 0 0 30px var(--c-green);
  }

  /* SECTION 4 — version reveal */
  .version {
    font-size: clamp(140px, 19vw, 280px);
    font-weight: 800;
    color: var(--c-cyan);
    text-shadow: 0 0 18px currentColor, 0 0 52px currentColor;
    margin: 2vh 0 5vh;
  }
  .status-list { display: flex; flex-direction: column; gap: 3vh; }
  .status-line {
    font-family: var(--font-mono);
    font-size: clamp(32px, 3.2vw, 46px);
    letter-spacing: 0.08em;
    color: var(--c-green);
    text-shadow: 0 0 9px currentColor, 0 0 22px currentColor;
    opacity: 0;
  }

  /* SECTION 5 — final message */
  .final-top {
    font-family: var(--font-mono);
    font-size: clamp(32px, 3vw, 44px);
    letter-spacing: 0.14em;
    color: var(--c-cyan);
    text-shadow: 0 0 9px currentColor, 0 0 22px currentColor;
    margin-bottom: 8vh;
  }
  .final-line {
    font-size: clamp(72px, 6.6vw, 110px);
    font-weight: 800;
    color: var(--c-green);
    text-shadow: 0 0 14px currentColor, 0 0 38px currentColor;
    max-width: 92vw;
    line-height: 1.15;
    opacity: 0;
  }
  .final-line + .final-line { margin-top: 4vh; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 14px currentColor, 0 0 30px currentColor; }
    50%      { text-shadow: 0 0 22px currentColor, 0 0 60px currentColor; }
  }

  /* Cyber-styled presenter controls */
  .ctrl {
    position: fixed;
    bottom: 22px;
    z-index: 5;
    display: flex;
    gap: 12px;
  }
  .ctrl.left { left: 22px; }
  .ctrl.right { right: 22px; }
  .btn {
    font-family: var(--font-mono);
    font-size: 17px;
    letter-spacing: 0.08em;
    color: var(--c-cyan);
    background: rgba(0, 212, 255, 0.05);
    border: 1px solid rgba(0, 212, 255, 0.35);
    border-radius: 4px;
    padding: 9px 15px;
    cursor: pointer;
    opacity: 0.32;
    transition: opacity 0.25s, box-shadow 0.25s, background 0.25s;
  }
  .btn:hover {
    opacity: 1;
    background: rgba(0, 212, 255, 0.12);
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.55);
  }

  /* Freeze every animation when the presenter pauses */
  body.paused *, body.paused::before, body.paused::after {
    animation-play-state: paused !important;
  }
</style>
</head>
<body>

  <!-- Five stacked sections; only one is visible at a time -->
  <div id="stage">
    <section class="section" id="s-title">
      <h1 class="os-title" id="osTitle" data-text=""></h1>
      <div class="subtitle" id="osSubtitle"></div>
    </section>

    <section class="section" id="s-issues">
      <div class="header"><span id="issuesHeader"></span><span class="caret">&#9611;</span></div>
      <div class="issue-list" id="issueList"></div>
    </section>

    <section class="section" id="s-updates">
      <div class="header" id="updatesHeader"></div>
      <div class="update-list" id="updateList"></div>
    </section>

    <section class="section" id="s-version">
      <div class="header" id="versionHeader"></div>
      <div class="version" id="versionNumber"></div>
      <div class="status-list" id="statusList"></div>
    </section>

    <section class="section" id="s-final">
      <div class="final-top" id="finalTop"></div>
      <div class="final-line" id="finalLine1"></div>
      <div class="final-line pulse" id="finalLine2"></div>
    </section>
  </div>

  <!-- Presenter controls -->
  <div class="ctrl left">
    <button class="btn" id="btnPrev">&#8592; PREV</button>
  </div>
  <div class="ctrl right">
    <button class="btn" id="btnNext">NEXT &#8594;</button>
    <button class="btn" id="btnToggle">&#9208; PAUSE</button>
  </div>

<script>
// ============================================================
// CONFIG — every editable piece of text lives here.
// ============================================================
const CONFIG = {
  title: "WRITING OS 2.0",
  subtitle: "// SYSTEM UPGRADING",
  detectedIssues: ["vague analysis", "weak evidence", "surface-level thinking"],
  installedUpdates: ["clear claims", "stronger evidence", "deeper analysis"],
  versionStatus: ["READER.EXE — UPGRADED", "WRITER.EXE — UPGRADED", "THINKER.EXE — UPGRADED"],
  finalMessage: {
    line1: "I didn't just improve my writing.",
    line2: "I improved how I think."
  },
  sectionDurationsMs: { title: 6000, issues: 8000, updates: 10000, version: 6000, final: 8000 }
};

// Fixed system UI labels — structural chrome, not student-editable narrative.
const LABELS = {
  scanning: "SCANNING SYSTEM...",
  issuesDetected: "ISSUES DETECTED",
  installing: "INSTALLING UPDATES",
  upgradeComplete: "UPGRADE COMPLETE",
  version: "v2.0",
  updateComplete: "UPDATE COMPLETE"
};

// Timing constants for fades and the post-final black hold.
const FADE_MS = 500;
const BLACK_MS = 1000;
const HEADER_CPS = 40;   // ms per character for header typing
const PHRASE_CPS = 80;   // ms per character for issue phrases

// ============================================================
// Static text injection — populate fixed structure from CONFIG.
// ============================================================
const $ = (id) => document.getElementById(id);

$("osTitle").textContent = CONFIG.title;
$("osTitle").setAttribute("data-text", CONFIG.title);
$("osSubtitle").textContent = CONFIG.subtitle;
$("updatesHeader").textContent = LABELS.installing;
$("versionHeader").textContent = LABELS.upgradeComplete;
$("versionNumber").textContent = LABELS.version;
$("finalTop").textContent = LABELS.updateComplete;
$("finalLine1").textContent = CONFIG.finalMessage.line1;
$("finalLine2").textContent = CONFIG.finalMessage.line2;

// Build the issue rows (icon + typed text span).
const issueRows = CONFIG.detectedIssues.map((text) => {
  const row = document.createElement("div");
  row.className = "issue";
  const warn = document.createElement("span");
  warn.className = "warn";
  warn.textContent = "⚠";
  const span = document.createElement("span");
  row.appendChild(warn);
  row.appendChild(span);
  $("issueList").appendChild(row);
  return { row, span, text };
});

// Build the update rows (label, percent, check, progress bar).
const updateRows = CONFIG.installedUpdates.map((text) => {
  const row = document.createElement("div");
  row.className = "update-row";
  row.innerHTML =
    '<div class="update-top"><span>' + text + '</span>' +
    '<span><span class="update-pct">0%</span> ' +
    '<span class="update-check">✓</span></span></div>' +
    '<div class="bar"><div class="bar-fill"></div></div>';
  $("updateList").appendChild(row);
  return {
    row,
    fill: row.querySelector(".bar-fill"),
    pct: row.querySelector(".update-pct"),
    check: row.querySelector(".update-check")
  };
});

// Build the version status lines.
const statusLines = CONFIG.versionStatus.map((text) => {
  const el = document.createElement("div");
  el.className = "status-line";
  el.textContent = text;
  $("statusList").appendChild(el);
  return el;
});

// ============================================================
// Section model — order, durations, DOM node, render function.
// ============================================================
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

// Returns how many characters of `full` are revealed at local time `t`.
function typedCount(t, start, cps, fullLen) {
  if (t < start) return -1;
  return Math.min(fullLen, Math.floor((t - start) / cps));
}

const sections = [
  {
    key: "title",
    el: $("s-title"),
    duration: CONFIG.sectionDurationsMs.title,
    render() { /* CSS drives the glitch; nothing time-based here */ }
  },
  {
    key: "issues",
    el: $("s-issues"),
    duration: CONFIG.sectionDurationsMs.issues,
    render(t) {
      const aStart = FADE_MS;
      const aEnd = aStart + LABELS.scanning.length * HEADER_CPS;
      const bStart = aEnd + 450;
      const bEnd = bStart + LABELS.issuesDetected.length * HEADER_CPS;
      const hdr = $("issuesHeader");
      const caret = hdr.nextElementSibling;

      if (t < bStart) {
        const n = typedCount(t, aStart, HEADER_CPS, LABELS.scanning.length);
        hdr.textContent = LABELS.scanning.slice(0, Math.max(0, n));
        caret.style.visibility = n >= 0 && n < LABELS.scanning.length ? "visible" : "hidden";
      } else {
        const n = typedCount(t, bStart, HEADER_CPS, LABELS.issuesDetected.length);
        hdr.textContent = LABELS.issuesDetected.slice(0, Math.max(0, n));
        caret.style.visibility = n < LABELS.issuesDetected.length ? "visible" : "hidden";
      }

      let cursor = bEnd + 250;
      issueRows.forEach((r) => {
        const n = typedCount(t, cursor, PHRASE_CPS, r.text.length);
        if (n < 0) {
          r.row.style.visibility = "hidden";
          r.span.textContent = "";
        } else {
          r.row.style.visibility = "visible";
          r.span.textContent = r.text.slice(0, n);
        }
        cursor += r.text.length * PHRASE_CPS + 250;
      });
    }
  },
  {
    key: "updates",
    el: $("s-updates"),
    duration: CONFIG.sectionDurationsMs.updates,
    render(t) {
      const avail = this.duration - FADE_MS * 2;
      const slot = avail / updateRows.length;
      const fillMs = slot * 0.82;
      updateRows.forEach((r, i) => {
        const start = FADE_MS + i * slot;
        if (t < start) {
          r.row.style.visibility = "hidden";
          return;
        }
        r.row.style.visibility = "visible";
        const pct = clamp(((t - start) / fillMs) * 100, 0, 100);
        r.fill.style.width = pct + "%";
        r.pct.textContent = Math.round(pct) + "%";
        r.check.style.opacity = pct >= 100 ? "1" : "0";
      });
    }
  },
  {
    key: "version",
    el: $("s-version"),
    duration: CONFIG.sectionDurationsMs.version,
    render(t) {
      $("versionNumber").style.opacity = clamp((t - (FADE_MS + 150)) / 600, 0, 1);
      const lineStart = FADE_MS + 850;
      statusLines.forEach((el, i) => {
        el.style.opacity = clamp((t - (lineStart + i * 950)) / 400, 0, 1);
      });
    }
  },
  {
    key: "final",
    el: $("s-final"),
    duration: CONFIG.sectionDurationsMs.final,
    render(t) {
      const l1 = FADE_MS + 300;
      $("finalLine1").style.opacity = clamp((t - l1) / 600, 0, 1);
      $("finalLine2").style.opacity = clamp((t - (l1 + 1000)) / 600, 0, 1);
    }
  }
];

// ============================================================
// Playback engine — single rAF clock, fades, loop, controls.
// ============================================================
let idx = 0;          // active section index
let t = 0;            // elapsed ms within current phase
let inBlackGap = false; // true during the 1s black hold after the final section
let paused = false;
let lastNow = null;

// Compute the active section's opacity from its local time.
function sectionOpacity(elapsed, duration) {
  if (elapsed < FADE_MS) return elapsed / FADE_MS;
  if (elapsed > duration - FADE_MS) return (duration - elapsed) / FADE_MS;
  return 1;
}

// Show only the active section and apply its computed opacity.
function applyVisibility() {
  sections.forEach((s, i) => {
    if (!inBlackGap && i === idx) {
      const op = clamp(sectionOpacity(t, s.duration), 0, 1);
      s.el.style.opacity = op;
      s.el.style.visibility = op > 0 ? "visible" : "hidden";
    } else {
      s.el.style.opacity = 0;
      s.el.style.visibility = "hidden";
    }
  });
}

// Advance to the next section, inserting a black hold after the last one.
function advance() {
  if (idx === sections.length - 1) {
    inBlackGap = true;
    t = 0;
  } else {
    idx += 1;
    t = 0;
  }
}

// Jump between sections manually (wraps around both ends).
function jump(delta) {
  inBlackGap = false;
  idx = (idx + delta + sections.length) % sections.length;
  t = FADE_MS; // skip fade-in so the presenter sees content immediately
}

// Per-frame loop: advance the clock, render, manage transitions.
function frame(now) {
  if (lastNow === null) lastNow = now;
  const dt = now - lastNow;
  lastNow = now;

  if (!paused) {
    t += dt;
    if (inBlackGap) {
      if (t >= BLACK_MS) { inBlackGap = false; idx = 0; t = 0; }
    } else if (t >= sections[idx].duration) {
      advance();
    }
  }

  if (!inBlackGap) sections[idx].render(t);
  applyVisibility();
  requestAnimationFrame(frame);
}

// Wire up the presenter controls.
$("btnToggle").addEventListener("click", () => {
  paused = !paused;
  document.body.classList.toggle("paused", paused);
  $("btnToggle").innerHTML = paused ? "▶ PLAY" : "⏸ PAUSE";
});
$("btnPrev").addEventListener("click", () => jump(-1));
$("btnNext").addEventListener("click", () => jump(1));

requestAnimationFrame(frame);
</script>
</body>
</html>
