<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Reading Year</title>

<!-- Fonts (only external dependency) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* Base: pure black, no scroll */
  :root {
    --serif: 'Cormorant Garamond', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; color: #fff; }
  body { font-family: var(--serif); cursor: default; }

  #field { position: fixed; inset: 0; display: block; z-index: 0; }

  /* Cinematic vignette over the whole frame */
  #vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0) 40%, rgba(0,0,0,0.4) 80%, rgba(0,0,0,0.82) 100%);
  }

  /* Text overlay never intercepts clicks */
  #ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

  /* Chapter marker, top-left */
  #marker {
    position: absolute; top: 34px; left: 38px;
    font-family: var(--mono); text-transform: uppercase;
    letter-spacing: 0.22em; font-size: clamp(13px, 1.2vw, 16px);
    color: rgba(255,255,255,0.5);
    opacity: 0; transition: opacity 0.8s ease;
  }

  /* Scene counter, bottom-right */
  #counter {
    position: absolute; bottom: 30px; right: 38px;
    font-family: var(--mono); letter-spacing: 0.18em;
    font-size: 12px; color: rgba(255,255,255,0.3);
    opacity: 0; transition: opacity 0.8s ease;
  }

  /* Scene 3 book title */
  #book-title {
    position: absolute; left: 50%; top: 19%;
    transform: translateX(-50%);
    font-family: var(--serif); font-style: italic; font-weight: 400;
    font-size: clamp(28px, 3vw, 44px);
    color: rgba(255,255,255,0.85);
    text-align: center; max-width: 80vw;
    opacity: 0; transition: opacity 1.1s ease;
  }

  /* Scene 4 final phrase, bottom-center */
  #final {
    position: absolute; left: 50%; bottom: 9%;
    transform: translateX(-50%);
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(32px, 3.4vw, 50px);
    color: rgba(255,255,255,0.95);
    text-align: center; max-width: 84vw;
    opacity: 0; transition: opacity 1.4s ease;
  }

  /* Scene 4 covers row */
  #covers {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex; gap: clamp(22px, 3.6vw, 60px);
    align-items: flex-start; justify-content: center;
    opacity: 0; transition: opacity 0.6s ease;
  }
  .cover { width: clamp(150px, 14.5vw, 224px); opacity: 0; transition: opacity 1.2s ease; }
  .cover-frame {
    position: relative; width: 100%; aspect-ratio: 2 / 3;
    border-radius: 3px; overflow: hidden;
    box-shadow: 0 0 60px rgba(255,255,255,0.06), 0 20px 60px rgba(0,0,0,0.8);
  }
  .cover-frame img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: brightness(0.78) saturate(0.85) contrast(1.05);
  }
  .cover-frame::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0) 45%, rgba(0,0,0,0.5) 85%, rgba(0,0,0,0.8) 100%);
  }
  .cover-fallback {
    position: absolute; inset: 0; display: none;
    flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 14% 12%;
    background: linear-gradient(160deg, #16161b 0%, #0a0a0d 100%);
  }
  .cover-fallback .fb-title {
    font-family: var(--serif); font-size: clamp(15px, 1.3vw, 19px);
    line-height: 1.25; color: rgba(255,255,255,0.85);
  }
  .cover-fallback .fb-author {
    font-family: var(--mono); text-transform: uppercase;
    letter-spacing: 0.16em; font-size: 10px;
    color: rgba(255,255,255,0.4); margin-top: 10%;
  }
  .cover-meta { margin-top: 15px; text-align: center; }
  .cover-meta .c-title {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(15px, 1.4vw, 20px);
    color: rgba(255,255,255,0.92); line-height: 1.2;
  }
  .cover-meta .c-author {
    font-family: var(--mono); text-transform: uppercase;
    letter-spacing: 0.14em; font-size: 12px;
    color: rgba(255,255,255,0.6); margin-top: 7px;
  }
  .tag {
    position: absolute; top: 10px; left: 50%;
    transform: translateX(-50%);
    font-family: var(--mono); text-transform: uppercase;
    font-variant: small-caps; letter-spacing: 0.18em;
    font-size: 11px; color: #fff;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.16);
    padding: 5px 11px; border-radius: 2px;
    animation: tagPulse 2.4s ease-in-out infinite;
  }
  @keyframes tagPulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
  body.paused .tag { animation-play-state: paused; }
</style>
</head>
<body>

  <canvas id="field"></canvas>
  <div id="vignette"></div>

  <div id="ui">
    <div id="marker"></div>
    <div id="counter"></div>
    <div id="book-title"></div>
    <div id="covers"></div>
    <div id="final"></div>
  </div>

<script>
// ============================================================
// CONFIG — editable text + scene parameters.
// ============================================================
const CONFIG = {
  text: {
    markers: ["01 / EARLY", "02 / HIROSHIMA", "03 / INDEPENDENT READING", "04 / NOW"],
    bookTitle: "Narrative of the Life of Frederick Douglass",
    finalPhrase: "AP Lang accelerated my love for reading.",
    counterTotal: "04",
    books: [
      // Rage of Innocence loads from a local file, bypassing the fetch chain.
      { title: "The Rage of Innocence", author: "Kristin Henning",
        isbn: "9781524748906", src: "covers/rage-of-innocence.jpg" },
      { title: "Why Machines Learn: The Elegant Math Behind Modern AI",
        author: "Anil Ananthaswamy", isbn: "9780593185742" },
      { title: "Resist: 35 Profiles of Ordinary People Who Rose Up Against Tyranny and Injustice",
        author: "Veronica Chambers", isbn: "9780062796257", tag: "Currently Reading" }
    ]
  },
  scene: {
    introMs: 2000,            // pure ambient before the sphere forms
    morphMs: 1600,            // visual reference for scene-to-scene flow
    ease: 0.04,               // per-frame approach toward target
    alphaEase: 0.06,
    sphere:    { radiusFrac: 0.22, breatheMs: 6000, breatheAmt: 0.10, spin: 0.22, clear: 0.30 },
    explosion: { maxFrac: 0.62, cycleMs: 6000, ringEveryMs: 5000, ringMs: 2500, clear: 0.13 },
    book:      { heightFrac: 0.34, openDelayMs: 3000, openMs: 1600,
                 rowsPerPage: 8, highlightOnMs: 1500, highlightFadeMs: 1000,
                 wordRatePerSec: 3, wordRisePx: 200, wordLifeMs: 2600, clear: 0.32 },
    vortex:    { maxFrac: 0.55, squash: 0.62, clear: 0.12,
                 coverDelayMs: 4000, coverStaggerMs: 600, coverFadeMs: 1200 }
  }
};

// ============================================================
// Helpers
// ============================================================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const $ = (id) => document.getElementById(id);
const TAU = Math.PI * 2;

// ============================================================
// Canvas + particle field
// ============================================================
const canvas = $("field");
const ctx = canvas.getContext("2d");
const SC = CONFIG.scene;

let W = 0, H = 0, cx = 0, cy = 0, dpr = 1;
let particles = [];
let mainN = 0, ambN = 0, accN = 0;
let bookClosed = [], bookOpen = [];   // per-main-particle slot geometry

// Cheap layered-noise drift used by ambient particles + jitter.
function noiseX(x, y, t) {
  return Math.cos(x * 0.0015 + t * 0.21) + Math.sin((x + y) * 0.0010 - t * 0.17);
}
function noiseY(x, y, t) {
  return Math.sin(y * 0.0016 - t * 0.19) + Math.cos((x - y) * 0.0011 + t * 0.15);
}

// Build the particle set once, sized to viewport width.
function buildParticles() {
  const total = clamp(Math.round(window.innerWidth * 1.6), 1500, 2500);
  mainN = Math.floor(total * 0.6);
  ambN = Math.floor(total * 0.2);
  accN = total - mainN - ambN;
  particles = new Array(total);

  for (let i = 0; i < total; i++) {
    const role = i < mainN ? "main" : (i < mainN + ambN ? "ambient" : "accent");
    const p = {
      x: Math.random() * W, y: Math.random() * H,
      tx: 0, ty: 0, ta: 0,
      vx: 0, vy: 0,
      size: 0.6 + Math.random() * 1.5,
      alpha: 0, role,
      ph: Math.random() * TAU,           // generic phase
      sp: 0.5 + Math.random() * 0.8      // generic speed
    };
    if (role === "main") {
      const k = i;
      // Fibonacci sphere unit vector for Scene 1.
      const phi = Math.acos(1 - 2 * (k + 0.5) / mainN);
      const th = Math.PI * (1 + Math.sqrt(5)) * (k + 0.5);
      p.sx = Math.sin(phi) * Math.cos(th);
      p.sy = Math.cos(phi);
      p.sz = Math.sin(phi) * Math.sin(th);
      // Explosion ray (Scene 2).
      p.ea = Math.random() * TAU;
      p.es = 0.45 + Math.random() * 0.55;
      p.eo = Math.random();
      // Vortex state (Scene 4).
      p.va = Math.random() * TAU;
      p.vr = 0;
      p.vseed = Math.random();
    }
    if (role === "accent") p.w = { on: false, age: 0, life: 0, vy: 0, half: 0 };
    particles[i] = p;
  }
  buildBookGeometry();
}

// Closed book = crisp rectangle outline + dense center spine.
// Open book = two flat page rectangles with 8 text-row guides each.
// Same particle keeps its category so closed -> open is a clean morph.
function buildBookGeometry() {
  bookClosed = new Array(mainN);
  bookOpen = new Array(mainN);

  const bh = H * SC.book.heightFrac;
  const bw = bh * 0.8;                       // 4:5, taller than wide
  const L = cx - bw / 2, R = cx + bw / 2;
  const Tp = cy - bh / 2, Bp = cy + bh / 2;
  const pw = bw * 0.96;                      // each open page width
  const rows = SC.book.rowsPerPage;

  const spineCount = Math.floor(mainN * 0.20);
  const periCount = Math.floor(mainN * 0.34);
  // remaining are row particles (text lines): mainN - spineCount - periCount

  for (let i = 0; i < mainN; i++) {
    let c, o;
    if (i < spineCount) {
      // Spine column: stays on the center axis in both states.
      const f = i / spineCount;
      const y = lerp(Tp, Bp, f);
      c = { x: cx, y };
      o = { x: cx, y };
    } else if (i < spineCount + periCount) {
      // Perimeter: closed = single rectangle, open = the two page borders.
      const f = (i - spineCount) / periCount;       // 0..1 around perimeter
      c = rectPoint(L, Tp, R, Bp, f);
      const side = f < 0.5 ? 0 : 1;                  // left page / right page
      const ff = (f % 0.5) * 2;
      o = side === 0
        ? rectPoint(cx - pw, Tp, cx, Bp, ff)
        : rectPoint(cx, Tp, cx + pw, Bp, ff);
    } else {
      // Text rows: hidden inside the spine when closed, spread on open.
      const r = i - spineCount - periCount;
      const page = r % 2;                            // 0 left, 1 right
      const rowI = Math.floor(r / 2) % rows;
      const along = ((Math.floor(r / 2 / rows)) % 7) / 7 + Math.random() * 0.04;
      const ry = lerp(Tp + bh * 0.10, Bp - bh * 0.10, rowI / (rows - 1));
      c = { x: cx, y: lerp(Tp, Bp, Math.random()) }; // collapsed onto spine
      o = page === 0
        ? { x: lerp(cx - pw * 0.86, cx - pw * 0.10, along), y: ry, row: rowI, page: 0 }
        : { x: lerp(cx + pw * 0.10, cx + pw * 0.86, along), y: ry, row: rowI, page: 1 };
    }
    bookClosed[i] = c;
    bookOpen[i] = o;
  }
}
// Point at fraction f (0..1) around a rectangle perimeter.
function rectPoint(x0, y0, x1, y1, f) {
  const w = x1 - x0, h = y1 - y0;
  const per = 2 * (w + h);
  let d = f * per;
  if (d < w) return { x: x0 + d, y: y0 };
  d -= w;
  if (d < h) return { x: x1, y: y0 + d };
  d -= h;
  if (d < w) return { x: x1 - d, y: y1 };
  d -= w;
  return { x: x0, y: y1 - d };
}

// ---- Scene target functions (set p.tx, p.ty, p.ta) ----

// Scene 1: breathing, slowly spinning sphere.
function targetsForSphere(p, st) {
  const s = SC.sphere;
  const baseR = Math.min(W, H) * s.radiusFrac;
  const breathe = 1 + s.breatheAmt * Math.sin((st / s.breatheMs) * TAU);
  const ang = (st / 1000) * s.spin;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const x = p.sx * ca + p.sz * sa;
  const z = -p.sx * sa + p.sz * ca;
  const R = baseR * breathe;
  const jitter = 6 * Math.sin(st * 0.002 * p.sp + p.ph);
  p.tx = cx + x * R + jitter;
  p.ty = cy + p.sy * R + jitter * 0.7;
  p.ta = 0.22 + 0.55 * ((z + 1) / 2);          // front particles brighter
}

// Scene 2: continuous outward explosion, desynced per particle.
function targetsForExplosion(p, st) {
  const e = SC.explosion;
  const maxR = Math.max(W, H) * e.maxFrac;
  const ph = ((st / e.cycleMs) * p.es + p.eo) % 1;
  const r = ph * maxR;
  p.tx = cx + Math.cos(p.ea) * r;
  p.ty = cy + Math.sin(p.ea) * r;
  p.ta = Math.sin(ph * Math.PI) * 0.7;          // faint origin -> fade at edge
}

// Scene 3: book (closed -> open), with row-highlight cycle.
let highlightIdx = 0;
function targetsForBook(p, i, st) {
  const b = SC.book;
  let openAmt = 0;
  if (st > b.openDelayMs) openAmt = easeIO(clamp((st - b.openDelayMs) / b.openMs, 0, 1));
  const c = bookClosed[i], o = bookOpen[i];
  p.tx = lerp(c.x, o.x, openAmt);
  p.ty = lerp(c.y, o.y, openAmt);

  // Base alpha: crisp outline + spine, dim text rows.
  let a = (o.row === undefined) ? 0.85 : 0.16;
  if (o.row !== undefined && openAmt > 0.6) {
    // One row across both pages brightens at a time, then the next.
    const total = b.rowsPerPage * 2;
    const idx = (o.page === 0 ? o.row : b.rowsPerPage + o.row);
    if (idx === highlightIdx % total) a = 0.95;
  }
  p.ta = a * (openAmt > 0.5 ? 1 : 0.7 + 0.3 * openAmt);
}

// Scene 4: wide rotating vortex, particles spiral inward and reseed.
function targetsForVortex(p, st, dt) {
  const v = SC.vortex;
  const maxR = Math.max(W, H) * v.maxFrac;
  if (p.vr <= 0) { p.vr = maxR * (0.55 + 0.45 * p.vseed); p.va = Math.random() * TAU; }
  const spd = 0.5 + 0.8 * (1 - p.vr / maxR);     // inner particles rotate faster
  p.va += dt * 0.0009 * spd;
  p.vr -= dt * 0.012 * (0.5 + p.vseed);          // slow inward drift
  p.tx = cx + Math.cos(p.va) * p.vr;
  p.ty = cy + Math.sin(p.va) * p.vr * v.squash;
  const f = p.vr / maxR;
  p.ta = Math.sin(clamp(f, 0, 1) * Math.PI) * 0.7;
  if (p.vr < maxR * 0.05) p.vr = 0;              // reseed at the edge
}

// Ambient particles: always alive on the noise field.
function ambientDrift(p, simS, dt) {
  p.vx += noiseX(p.x, p.y, simS) * 0.010;
  p.vy += noiseY(p.x, p.y, simS) * 0.010;
  p.vx *= 0.95; p.vy *= 0.95;
  p.x += p.vx; p.y += p.vy;
  if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
  if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;
  p.ta = 0.10 + 0.16 * (0.5 + 0.5 * Math.sin(simS * p.sp + p.ph));
}

// Scene 3 word-stream: clusters of accent particles rising off the pages.
let wordAcc = 0;
function spawnWordCluster() {
  const b = SC.book;
  const bh = H * b.heightFrac, bw = bh * 0.8;
  const half = Math.random() < 0.5 ? -1 : 1;
  const baseX = cx + half * (bw * 0.12 + Math.random() * bw * 0.78);
  const baseY = cy + (Math.random() - 0.3) * bh * 0.4;
  const width = 30 + Math.random() * 50;
  const life = b.wordLifeMs * (0.8 + Math.random() * 0.5);
  let placed = 0, need = 8 + Math.floor(Math.random() * 6);
  for (let i = mainN + ambN; i < particles.length && placed < need; i++) {
    const p = particles[i];
    if (p.w.on) continue;
    p.w.on = true; p.w.age = 0; p.w.life = life;
    p.w.vy = (b.wordRisePx / life);
    p.x = baseX + (Math.random() - 0.5) * width;
    p.y = baseY + (Math.random() - 0.5) * 7;
    p.alpha = 0;
    placed++;
  }
}
function updateWordParticle(p, dt) {
  const w = p.w;
  if (!w.on) { p.ta = 0; p.alpha *= 0.9; return; }
  w.age += dt;
  if (w.age >= w.life) { w.on = false; p.ta = 0; return; }
  const t = w.age / w.life;
  p.y -= w.vy * dt;
  p.x += Math.sin(t * 5 + p.ph) * 0.4;
  p.ta = Math.sin(t * Math.PI) * 0.55;
  p.alpha = p.ta;
}

// ============================================================
// Scene controller
// ============================================================
let scene = 0;              // 0..3
let phase = "intro";        // "intro" | "scene"
let simT = 0;               // virtual ms, frozen while paused
let sceneT0 = 0;            // simT when current scene started
let paused = false;
let coverStart = -1;        // simT when covers were triggered
let forcedCovers = false;
let shockRings = [];
let lastTS = null;
let fpsAcc = 0, fpsFrames = 0;

const elMarker = $("marker");
const elCounter = $("counter");
const elTitle = $("book-title");
const elFinal = $("final");
const elCovers = $("covers");

function setScene(i) {
  scene = clamp(i, 0, 3);
  phase = "scene";
  sceneT0 = simT;
  coverStart = -1;
  forcedCovers = false;
  shockRings = [];
  highlightIdx = 0;
  // Clear any in-flight word particles when leaving Scene 3.
  for (let k = mainN + ambN; k < particles.length; k++) particles[k].w.on = false;
  updateUI();
}
function nextScene() {
  if (phase === "intro") { phase = "scene"; scene = 0; sceneT0 = simT; updateUI(); return; }
  if (scene === 3) {
    // Last scene: first advance reveals covers, then it just holds.
    if (coverStart < 0) { coverStart = simT; forcedCovers = true; updateUI(); }
    return;
  }
  setScene(scene + 1);
}
function prevScene() {
  if (phase === "intro") return;
  if (scene === 3 && coverStart >= 0) { coverStart = -1; forcedCovers = false; updateUI(); return; }
  if (scene === 0) return;
  setScene(scene - 1);
}
function restart() {
  simT = 0; sceneT0 = 0; scene = 0; phase = "scene";
  coverStart = -1; forcedCovers = false; shockRings = []; highlightIdx = 0;
  for (let k = mainN + ambN; k < particles.length; k++) particles[k].w.on = false;
  updateUI();
}

// Show/hide the DOM overlay for the active scene.
function updateUI() {
  const showScene = phase === "scene";
  elMarker.textContent = showScene ? CONFIG.text.markers[scene] : "";
  elMarker.style.opacity = showScene ? 1 : 0;
  elCounter.textContent = showScene
    ? String(scene + 1).padStart(2, "0") + " / " + CONFIG.text.counterTotal : "";
  elCounter.style.opacity = showScene ? 1 : 0;
  elTitle.style.opacity = (showScene && scene === 2) ? 1 : 0;
  if (showScene && scene === 2) elTitle.textContent = CONFIG.text.bookTitle;
  elCovers.style.opacity = (showScene && scene === 3 && coverStart >= 0) ? 1 : 0;
  if (!(showScene && scene === 3 && coverStart >= 0)) {
    elFinal.style.opacity = 0;
    coverCards.forEach((c) => (c.style.opacity = 0));
  }
}

// ============================================================
// Main loop
// ============================================================
function frame(ts) {
  if (lastTS === null) lastTS = ts;
  let dt = ts - lastTS;
  lastTS = ts;
  dt = Math.min(dt, 50);

  if (!paused) simT += dt;
  const st = simT - sceneT0;
  const simS = simT / 1000;

  // Opening: ambient field drifts in, then forms Scene 1 (one-time, not an
  // inter-scene auto-advance — scenes 1->4 only move on presenter input).
  if (phase === "intro" && !paused && simT > CONFIG.scene.introMs) {
    phase = "scene"; scene = 0; sceneT0 = simT;
    updateUI();
  }

  // Active scene clear-alpha controls the motion-blur trail.
  let clearA = 0.20;
  if (phase === "scene") {
    clearA = [SC.sphere.clear, SC.explosion.clear, SC.book.clear, SC.vortex.clear][scene];
  }
  ctx.fillStyle = "rgba(0,0,0," + clearA + ")";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#fff";

  // Scene 3 continuous word-stream spawning.
  if (!paused && phase === "scene" && scene === 2) {
    const b = SC.book;
    if (st > b.openDelayMs + b.openMs) {
      wordAcc += dt;
      const interval = 1000 / b.wordRatePerSec;
      while (wordAcc >= interval) { spawnWordCluster(); wordAcc -= interval; }
    }
  }

  // Scene 3 row-highlight cycle.
  if (phase === "scene" && scene === 2) {
    const b = SC.book;
    const slot = b.highlightOnMs + b.highlightFadeMs;
    highlightIdx = Math.floor(Math.max(0, st - b.openDelayMs - b.openMs) / slot);
  }

  // Update + draw every particle.
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];

    if (p.role === "ambient") {
      if (!paused) ambientDrift(p, simS, dt);
    } else if (p.role === "accent") {
      if (phase === "scene" && scene === 2) {
        if (!paused) updateWordParticle(p, dt);
      } else {
        p.w.on = false;
        if (!paused) ambientDrift(p, simS, dt);
      }
    } else {
      // main particle: follow the active scene's target
      if (phase === "intro") {
        if (!paused) ambientDrift(p, simS, dt);
      } else if (!paused) {
        if (scene === 0) targetsForSphere(p, st);
        else if (scene === 1) targetsForExplosion(p, st);
        else if (scene === 2) targetsForBook(p, i, st);
        else targetsForVortex(p, st, dt);
        p.x += (p.tx - p.x) * SC.ease;
        p.y += (p.ty - p.y) * SC.ease;
      }
    }

    if (!paused) p.alpha += (p.ta - p.alpha) * SC.alphaEase;
    if (p.alpha > 0.003) {
      ctx.globalAlpha = clamp(p.alpha, 0, 1);
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;

  // Scene 2 expanding shock-ring pulse.
  if (phase === "scene" && scene === 1) {
    const e = SC.explosion;
    if (!paused && (shockRings.length === 0 ||
        st - shockRings[shockRings.length - 1].born > e.ringEveryMs)) {
      shockRings.push({ born: st });
    }
    const maxR = Math.max(W, H) * e.maxFrac;
    for (let r = shockRings.length - 1; r >= 0; r--) {
      const age = st - shockRings[r].born;
      if (age > e.ringMs) { shockRings.splice(r, 1); continue; }
      const pr = age / e.ringMs;
      ctx.globalAlpha = (1 - pr) * 0.16;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(cx, cy, pr * maxR, 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // Scene 4 cover reveal (timed after vortex stabilizes, or forced).
  if (phase === "scene" && scene === 3) {
    if (coverStart < 0 && !paused && st > SC.vortex.coverDelayMs) coverStart = simT;
    if (coverStart >= 0) {
      elCovers.style.opacity = 1;
      const ct = simT - coverStart;
      coverCards.forEach((card, idx) => {
        const s = idx * SC.vortex.coverStaggerMs;
        card.style.opacity = clamp((ct - s) / SC.vortex.coverFadeMs, 0, 1);
      });
      const settled = (coverCards.length - 1) * SC.vortex.coverStaggerMs
        + SC.vortex.coverFadeMs + 500;
      elFinal.textContent = CONFIG.text.finalPhrase;
      elFinal.style.opacity = ct > settled ? 1 : 0;
    }
  }

  // Adaptive performance: thin particles if the frame rate drops.
  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 1000) {
    const fps = fpsFrames / (fpsAcc / 1000);
    if (fps < 55 && particles.length > 900) {
      particles.length = Math.floor(particles.length * 0.9);
    }
    fpsAcc = 0; fpsFrames = 0;
  }

  requestAnimationFrame(frame);
}

// ============================================================
// Book covers — local override for #1, fallback chain for the rest.
// ============================================================
const coverCards = [];
function buildCovers() {
  CONFIG.text.books.forEach((bk) => {
    const card = document.createElement("div");
    card.className = "cover";
    const frame = document.createElement("div");
    frame.className = "cover-frame";
    const img = document.createElement("img");
    img.alt = bk.title;
    const fb = document.createElement("div");
    fb.className = "cover-fallback";
    fb.innerHTML = '<div class="fb-title">' + bk.title +
      '</div><div class="fb-author">' + bk.author + '</div>';
    frame.appendChild(img);
    frame.appendChild(fb);
    if (bk.tag) {
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = bk.tag;
      frame.appendChild(tag);
    }
    const meta = document.createElement("div");
    meta.className = "cover-meta";
    meta.innerHTML = '<div class="c-title">' + bk.title +
      '</div><div class="c-author">' + bk.author + '</div>';
    card.appendChild(frame);
    card.appendChild(meta);
    elCovers.appendChild(card);
    coverCards.push(card);
    loadCover(img, fb, bk);
  });
}
function loadCover(img, fb, bk) {
  const showFallback = () => { img.style.display = "none"; fb.style.display = "flex"; };

  if (bk.src) {
    // Local override: this book only. No Open Library / Google Books.
    img.onerror = showFallback;
    img.onload = () => { if (img.naturalWidth <= 2) showFallback(); };
    img.src = bk.src;
    return;
  }

  const sources = [
    "https://covers.openlibrary.org/b/isbn/" + bk.isbn + "-L.jpg?default=false",
    "https://covers.openlibrary.org/b/isbn/" + bk.isbn + "-M.jpg?default=false"
  ];
  let idx = 0;
  const tryGoogle = () => {
    fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:" + bk.isbn)
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((d) => {
        const vi = d && d.items && d.items[0] && d.items[0].volumeInfo;
        const lk = vi && vi.imageLinks;
        const u = lk && (lk.thumbnail || lk.smallThumbnail);
        if (!u) return showFallback();
        img.onerror = showFallback;
        img.onload = null;
        img.src = u.replace("&zoom=1", "&zoom=2").replace("http://", "https://");
      })
      .catch(showFallback);
  };
  const next = () => { idx < sources.length ? (img.src = sources[idx++]) : tryGoogle(); };
  img.onerror = next;
  img.onload = () => { if (img.naturalWidth <= 2) next(); };
  next();
}

// ============================================================
// Presenter controls
// ============================================================
window.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "ArrowDown" || k === "ArrowRight" || k === " " || k === "Enter") {
    e.preventDefault(); nextScene();
  } else if (k === "ArrowUp" || k === "ArrowLeft" || k === "Backspace") {
    e.preventDefault(); prevScene();
  } else if (k === "p" || k === "P") {
    paused = !paused;
    document.body.classList.toggle("paused", paused);
  } else if (k === "r" || k === "R") {
    restart();
  }
});
window.addEventListener("click", () => nextScene());

// One scene change per wheel gesture (debounced).
let wheelLock = 0;
window.addEventListener("wheel", (e) => {
  const now = performance.now();
  if (now - wheelLock < 700) return;
  if (Math.abs(e.deltaY) < 6) return;
  wheelLock = now;
  e.deltaY > 0 ? nextScene() : prevScene();
}, { passive: true });

// ============================================================
// Boot + resize
// ============================================================
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cx = W / 2; cy = H / 2;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!particles.length) buildParticles();
  else buildBookGeometry();
}
window.addEventListener("resize", resize);

resize();
buildCovers();
updateUI();
requestAnimationFrame(frame);
</script>
</body>
