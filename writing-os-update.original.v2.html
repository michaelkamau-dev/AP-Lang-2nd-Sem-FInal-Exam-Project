<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Reading Year</title>

<!-- Cinematic serif body font (only external dependency, loaded via link) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
  /* Base: pure black canvas, no scroll, fonts */
  :root {
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --mono: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
  }
  body { font-family: var(--serif); }

  /* Particle canvas fills the viewport behind everything */
  #field {
    position: fixed;
    inset: 0;
    display: block;
    z-index: 0;
  }

  /* Soft cinematic vignette over the whole frame */
  #vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0) 38%, rgba(0,0,0,0.45) 78%, rgba(0,0,0,0.85) 100%);
  }

  /* Text layer, centered, never intercepts clicks */
  #text-layer {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
    padding: 6vh 7vw;
  }

  /* Chapter marker: condensed mono, wide tracking, dim */
  #marker {
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.25em;
    font-size: clamp(14px, 1.4vw, 18px);
    color: rgba(255,255,255,0.6);
    opacity: 0;
    margin-bottom: 4.2vh;
  }

  /* Primary story line: serif, large, gently negative tracking */
  #line {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(36px, 4.6vw, 68px);
    letter-spacing: -0.012em;
    line-height: 1.18;
    color: rgba(255,255,255,0.95);
    max-width: 19ch;
    opacity: 0;
  }
  #line.final {
    font-size: clamp(40px, 5vw, 74px);
    color: #fff;
    max-width: 22ch;
  }

  /* Beat 3 book title: serif italic, a touch smaller than lines */
  #book-title {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(26px, 3.2vw, 46px);
    letter-spacing: 0.005em;
    color: rgba(255,255,255,0.9);
    max-width: 20ch;
    margin-bottom: 3vh;
    opacity: 0;
  }

  /* Beat 4 covers row */
  #covers {
    display: flex;
    gap: clamp(20px, 3.4vw, 56px);
    align-items: flex-start;
    justify-content: center;
    margin-top: 3.5vh;
    opacity: 0;
  }
  .cover {
    position: relative;
    width: clamp(150px, 15vw, 230px);
    opacity: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .cover-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(255,255,255,0.06), 0 20px 60px rgba(0,0,0,0.8);
  }
  .cover-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: brightness(0.78) saturate(0.85) contrast(1.05);
  }
  /* Dark vignette layered on top of each cover */
  .cover-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0) 45%, rgba(0,0,0,0.5) 85%, rgba(0,0,0,0.8) 100%);
  }
  /* Typographic fallback cover when no image can be fetched */
  .cover-fallback {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 14% 12%;
    background: linear-gradient(160deg, #15151a 0%, #0a0a0d 100%);
  }
  .cover-fallback .fb-title {
    font-family: var(--serif);
    font-size: clamp(15px, 1.3vw, 19px);
    line-height: 1.25;
    color: rgba(255,255,255,0.85);
  }
  .cover-fallback .fb-author {
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    margin-top: 10%;
  }
  .cover-meta { margin-top: 16px; }
  .cover-meta .c-title {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(15px, 1.5vw, 22px);
    color: rgba(255,255,255,0.92);
    line-height: 1.2;
  }
  .cover-meta .c-author {
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: clamp(9px, 0.85vw, 12px);
    color: rgba(255,255,255,0.4);
    margin-top: 8px;
  }
  /* "CURRENTLY READING" tag, gently pulsing */
  .tag {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 10px;
    font-variant: small-caps;
    color: #fff;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    padding: 5px 10px;
    border-radius: 2px;
    animation: tagPulse 2.4s ease-in-out infinite;
  }
  @keyframes tagPulse {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 1; }
  }

  /* Presenter controls: low-opacity mono, brighten on hover */
  .ctrl {
    position: fixed;
    bottom: 26px;
    z-index: 3;
    display: flex;
    gap: 22px;
  }
  .ctrl.left  { left: 30px; }
  .ctrl.right { right: 30px; }
  .ctrl button {
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    background: none;
    border: none;
    cursor: pointer;
    transition: color 0.3s ease;
  }
  .ctrl button:hover { color: rgba(255,255,255,1); }

  /* Pause freezes CSS animations (the tag) too */
  body.paused .tag { animation-play-state: paused; }
</style>
</head>
<body>

  <!-- Ambient particle field -->
  <canvas id="field"></canvas>
  <div id="vignette"></div>

  <!-- Text overlay -->
  <div id="text-layer">
    <div id="marker"></div>
    <div id="book-title"></div>
    <div id="line"></div>
    <div id="covers"></div>
  </div>

  <!-- Presenter controls -->
  <div class="ctrl left">
    <button id="btnPrev">&#8592; Prev</button>
  </div>
  <div class="ctrl right">
    <button id="btnPause">Pause</button>
    <button id="btnNext">Next &#8594;</button>
  </div>

<script>
// ============================================================
// CONFIG — every editable word lives here.
// ============================================================
const CONFIG = {
  // All on-screen narrative copy, by beat.
  beats: {
    early: {
      marker: "FIRST SEMESTER",
      lines: [
        "I could tell I wasn't a strong reader.",
        "Earlier passages, I'd read them and not find the argument.",
        "Even when I got the surface meaning, I had no clue what the writer was actually doing."
      ]
    },
    hiroshima: {
      marker: "SECOND SEMESTER",
      lines: [
        "Then we read Hiroshima.",
        "I expected to be better by now. I wasn't.",
        "My reading wasn't good. It was horrible.",
        "Couldn't analyze why a writer chose a sentence.",
        "Definitely couldn't explain it on paper."
      ]
    },
    breakthrough: {
      marker: "INDEPENDENT READING ASSIGNMENT",
      bookTitle: "Narrative of the Life of Frederick Douglass",
      analysisLines: [
        "I went slow on purpose.",
        "Broke down each sentence.",
        "Looked up every word I didn't know.",
        "Tied each one back to the text.",
        "I finished the book."
      ],
      clickLine: "That's when it clicked."
    },
    now: {
      marker: "NOW",
      openingLine: "I read all the time.",
      closingLine: "AP Lang accelerated my love for reading.",
      books: [
        {
          title: "The Rage of Innocence",
          author: "Kristin Henning",
          isbn: "9781524748906"
        },
        {
          title: "Why Machines Learn: The Elegant Math Behind Modern AI",
          author: "Anil Ananthaswamy",
          isbn: "9780593185742"
        },
        {
          title: "Resist: 35 Profiles of Ordinary People Who Rose Up Against Tyranny and Injustice",
          author: "Veronica Chambers",
          isbn: "9780062796257",
          tag: "Currently Reading"
        }
      ]
    }
  },

  // Every duration is tunable here (milliseconds).
  timing: {
    introAmbientMs: 2200,   // pure particles, no text, at the very start
    beatGapMs: 2400,        // pure ambient before each new chapter marker

    markerInMs: 1100, markerHoldMs: 2000, markerOutMs: 900,
    lineInMs: 1100, lineHoldMs: 2400, lineOutMs: 900,
    finalInMs: 1300, finalHoldMs: 3200, finalOutMs: 1200,

    // Beat 3 book choreography
    bookTitleInMs: 1300,
    bookFormMs: 3800,       // ambient particles converge into a closed book
    bookClosedHoldMs: 1400, // closed book holds
    bookOpenMs: 2800,       // book opens into two facing pages
    bookCloseMs: 2800,      // pages fold back, particles released

    // Beat 4 covers
    coverStaggerMs: 650,    // delay between each cover starting its fade
    coverFadeMs: 1200,      // each cover's opacity 0 -> 1 duration
    coversSettleMs: 8000    // total window for covers to drift in and settle
  }
};

// ============================================================
// Small helpers
// ============================================================
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const $ = (id) => document.getElementById(id);

// Fade envelope: 0 -> 1 over inMs, hold, 1 -> 0 over outMs.
function envelope(localT, inMs, totalMs, outMs) {
  if (localT < 0 || localT > totalMs) return 0;
  if (localT < inMs) return clamp(localT / inMs, 0, 1);
  if (localT > totalMs - outMs) return clamp((totalMs - localT) / outMs, 0, 1);
  return 1;
}

// ============================================================
// Timeline — flat list of contiguous cues built from CONFIG.
// ============================================================
const T = CONFIG.timing;
const B = CONFIG.beats;

const cues = [];   // { kind, start, dur, inMs, outMs, text, el, director }
const beats = [];  // { name, start } for PREV / NEXT
let cursor = 0;

function add(kind, dur, extra) {
  const cue = Object.assign({ kind, start: cursor, dur, inMs: 0, outMs: 0 }, extra || {});
  cues.push(cue);
  cursor += dur;
  return cue;
}
function addGap(ms) { add("gap", ms, { director: "ambient" }); }
function addMarker(text) {
  add("marker", T.markerInMs + T.markerHoldMs + T.markerOutMs, {
    text, el: "marker", inMs: T.markerInMs, outMs: T.markerOutMs, director: "ambient"
  });
}
function addLine(text, opts) {
  opts = opts || {};
  add("line", T.lineInMs + T.lineHoldMs + T.lineOutMs, {
    text, el: "line", inMs: T.lineInMs, outMs: T.lineOutMs,
    director: opts.director || "ambient"
  });
}
function addFinal(text, director) {
  add("final", T.finalInMs + T.finalHoldMs + T.finalOutMs, {
    text, el: "line", final: true, inMs: T.finalInMs, outMs: T.finalOutMs,
    director: director || "ambient"
  });
}
function addDir(mode, dur) { add("dir", dur, { director: mode }); }

// Opening: pure ambient particles, no text.
addGap(T.introAmbientMs);

// BEAT 1 — EARLY
beats.push({ name: "early", start: cursor });
addMarker(B.early.marker);
B.early.lines.forEach((l) => addLine(l));

// BEAT 2 — HIROSHIMA
addGap(T.beatGapMs);
beats.push({ name: "hiroshima", start: cursor });
addMarker(B.hiroshima.marker);
B.hiroshima.lines.forEach((l) => addLine(l));

// BEAT 3 — BREAKTHROUGH (book sequence)
addGap(T.beatGapMs);
beats.push({ name: "breakthrough", start: cursor });
addMarker(B.breakthrough.marker);
const bookTitleStart = cursor;                 // serif title appears, then persists
addDir("bookForm", T.bookFormMs);              // particles converge into a closed book
addDir("bookHold", T.bookClosedHoldMs);        // closed book holds
addDir("bookOpen", T.bookOpenMs);              // book opens into facing pages
const wordsStart = cursor;                     // word-shapes start lifting here
B.breakthrough.analysisLines.forEach((l) => addLine(l, { director: "bookOpenHold" }));
const wordsEnd = cursor;
addDir("bookClose", T.bookCloseMs);            // pages fold, particles released
const bookTitleEnd = cursor;                   // title fades out as the book closes
addFinal(B.breakthrough.clickLine, "ambient"); // "That's when it clicked." alone

// BEAT 4 — NOW
addGap(T.beatGapMs);
beats.push({ name: "now", start: cursor });
addMarker(B.now.marker);
addLine(B.now.openingLine);
const coversStart = cursor;
addDir("ambient", T.coversSettleMs);           // covers drift in over this window
addFinal(B.now.closingLine, "ambient");
const coversEnd = cursor;

const TOTAL = cursor;

// Precompute staggered lift-off times for Beat 3 word-shapes.
const WORD_COUNT = 5;
const wordSpawnTimes = [];
{
  const span = (wordsEnd - wordsStart) * 0.62;
  for (let i = 0; i < WORD_COUNT; i++) {
    wordSpawnTimes.push(wordsStart + 600 + (span / WORD_COUNT) * i);
  }
}

// ============================================================
// Particle field — ambient drift + Beat 3 book formation.
// ============================================================
const canvas = $("field");
const ctx = canvas.getContext("2d");

let cssW = 0, cssH = 0, dpr = 1;
let particles = [];
let bookCount = 0;          // first N particles can be recruited into the book
let geom = null;            // book geometry + sampled targets

// Director scalars (smoothed): how bound to the book, how open it is.
let formAmt = 0, openAmt = 0;
let released = false;       // book particles flung back to ambient after close

// Flow-field angle from layered sine waves (cheap, organic).
function flowAngle(x, y, t) {
  return (
    Math.sin(x * 0.0016 + t * 0.05) +
    Math.cos(y * 0.0018 - t * 0.04) +
    Math.sin((x + y) * 0.0011 + t * 0.03)
  ) * 0.95;
}

// Distribute K points evenly along a set of polylines.
function sampleAlong(polys, K) {
  const segs = [];
  let total = 0;
  for (const p of polys) {
    for (let i = 0; i < p.length - 1; i++) {
      const a = p[i], b = p[i + 1];
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      if (len > 0) { segs.push({ a, b, len }); total += len; }
    }
  }
  const pts = [];
  for (let i = 0; i < K; i++) {
    let d = (i / K) * total;
    for (const s of segs) {
      if (d <= s.len) {
        const tt = d / s.len;
        pts.push({ x: s.a.x + (s.b.x - s.a.x) * tt, y: s.a.y + (s.b.y - s.a.y) * tt });
        break;
      }
      d -= s.len;
    }
  }
  while (pts.length < K) pts.push(Object.assign({}, pts[pts.length - 1] || { x: 0, y: 0 }));
  return pts;
}

// Build closed-book and open-book target outlines for the current viewport.
function buildGeometry() {
  const cx = cssW / 2;
  const cy = cssH * 0.52;
  const bw = clamp(Math.min(cssW, cssH) * 0.46, 300, 600);
  const bh = bw * 0.64;
  const L = cx - bw / 2, R = cx + bw / 2, Tp = cy - bh / 2, Bp = cy + bh / 2;

  // Closed book: rectangle outline plus a center spine line.
  const closedPolys = [
    [{x:L,y:Tp},{x:R,y:Tp},{x:R,y:Bp},{x:L,y:Bp},{x:L,y:Tp}],
    [{x:cx,y:Tp},{x:cx,y:Bp}]
  ];

  // Open book: two facing pages meeting at the spine.
  const spineTop = { x: cx, y: cy - bh * 0.52 };
  const spineBot = { x: cx, y: cy + bh * 0.50 };
  const leftTop  = { x: cx - bw * 0.60, y: cy - bh * 0.40 };
  const leftBot  = { x: cx - bw * 0.60, y: cy + bh * 0.56 };
  const rightTop = { x: cx + bw * 0.60, y: cy - bh * 0.40 };
  const rightBot = { x: cx + bw * 0.60, y: cy + bh * 0.56 };
  const openPolys = [
    [spineTop, leftTop, leftBot, spineBot],
    [spineTop, rightTop, rightBot, spineBot],
    [spineTop, spineBot]
  ];

  const K = bookCount;
  geom = {
    cx, cy, bw, bh,
    closed: sampleAlong(closedPolys, K),
    open: sampleAlong(openPolys, K)
  };
}

// Create the particle set sized to the viewport.
function initParticles() {
  const area = cssW * cssH;
  const target = clamp(Math.round(area / 1500), 800, 1500);
  bookCount = Math.min(480, Math.floor(target * 0.4));
  particles = [];
  for (let i = 0; i < target; i++) {
    particles.push({
      fx: Math.random() * cssW,
      fy: Math.random() * cssH,
      vx: 0, vy: 0,
      rx: 0, ry: 0,
      size: 0.5 + Math.random() * 1.5,
      aBase: 0.14 + Math.random() * 0.5,
      aPhase: Math.random() * Math.PI * 2,
      aSpeed: 0.6 + Math.random() * 1.4,
      book: i < bookCount
    });
  }
  buildGeometry();
}

// Resize / DPR handling.
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const newW = window.innerWidth;
  const newH = window.innerHeight;
  const ratioX = cssW ? newW / cssW : 1;
  const ratioY = cssH ? newH / cssH : 1;
  cssW = newW; cssH = newH;
  canvas.width = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!particles.length) {
    initParticles();
  } else {
    for (const p of particles) { p.fx *= ratioX; p.fy *= ratioY; }
    initParticlesCountOnly();
    buildGeometry();
  }
}
// Keep existing positions but re-evaluate desired count after a resize.
function initParticlesCountOnly() {
  const area = cssW * cssH;
  const want = clamp(Math.round(area / 1500), 800, 1500);
  bookCount = Math.min(480, Math.floor(want * 0.4));
  if (want < particles.length) particles.length = want;
  while (particles.length < want) {
    const i = particles.length;
    particles.push({
      fx: Math.random() * cssW, fy: Math.random() * cssH,
      vx: 0, vy: 0, rx: 0, ry: 0,
      size: 0.5 + Math.random() * 1.5,
      aBase: 0.14 + Math.random() * 0.5,
      aPhase: Math.random() * Math.PI * 2,
      aSpeed: 0.6 + Math.random() * 1.4,
      book: i < bookCount
    });
  }
}

// Word-shapes that lift off the open pages (abstract, not real words).
let wordShapes = [];
function spawnWordShape() {
  const g = geom;
  const side = Math.random() < 0.5 ? -1 : 1;
  wordShapes.push({
    x: g.cx + side * (Math.random() * g.bw * 0.42) ,
    y: g.cy + (Math.random() * g.bh * 0.30),
    w: 50 + Math.random() * 90,
    h: 9 + Math.random() * 7,
    age: 0,
    life: 4200 + Math.random() * 1200,
    sway: Math.random() * Math.PI * 2,
    rise: 26 + Math.random() * 16
  });
}

// Advance director scalars toward the targets implied by the active cue.
function updateDirector(mode, localT, dur, dt) {
  let tForm = formAmt, tOpen = openAmt;
  if (mode === "ambient") { tForm = 0; }
  else if (mode === "bookForm") { tForm = clamp(localT / dur, 0, 1); tOpen = 0; }
  else if (mode === "bookHold") { tForm = 1; tOpen = 0; }
  else if (mode === "bookOpen") { tForm = 1; tOpen = clamp(localT / dur, 0, 1); }
  else if (mode === "bookOpenHold") { tForm = 1; tOpen = 1; }
  else if (mode === "bookClose") {
    const p = clamp(localT / dur, 0, 1);
    tOpen = 1 - clamp(p / 0.6, 0, 1);
    tForm = 1 - clamp((p - 0.4) / 0.6, 0, 1);
  }
  const k = clamp(dt / 220, 0, 1);          // smooth approach (also smooths jumps)
  formAmt += (tForm - formAmt) * k;
  openAmt += (tOpen - openAmt) * k;

  // Release book particles once they have detached after the close.
  if (mode === "bookClose" && formAmt < 0.04 && !released) {
    released = true;
    const g = geom;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (!p.book) continue;
      p.fx = p.rx; p.fy = p.ry;
      const ang = Math.atan2(p.ry - g.cy, p.rx - g.cx);
      p.vx = Math.cos(ang) * 0.6;
      p.vy = Math.sin(ang) * 0.6;
    }
  }
  if (mode === "bookForm") released = false;  // re-arm for the next loop
}

// Step + render the whole particle field for one frame.
// `moving` is false while paused, freezing all motion.
function renderField(flowT, dt, moving) {
  // Trail amount: soft when ambient, crisper while the book is drawn.
  const clearA = lerp(0.16, 0.5, formAmt);
  ctx.globalAlpha = 1;
  ctx.fillStyle = "rgba(0,0,0," + clearA + ")";
  ctx.fillRect(0, 0, cssW, cssH);

  const g = geom;
  ctx.fillStyle = "#fff";
  const ef = easeInOut(clamp(formAmt, 0, 1));
  const eo = easeInOut(clamp(openAmt, 0, 1));

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];

    // Free drift along the flow field (frozen while paused).
    if (moving) {
      const ang = flowAngle(p.fx, p.fy, flowT);
      p.vx += Math.cos(ang) * 0.05;
      p.vy += Math.sin(ang) * 0.05;
      // Very gentle global swirl for a cinematic vortex feel.
      const dx = p.fx - cssW / 2, dy = p.fy - cssH / 2;
      p.vx += -dy * 0.000018;
      p.vy +=  dx * 0.000018;
      p.vx *= 0.96; p.vy *= 0.96;
      p.fx += p.vx; p.fy += p.vy;

      // Reseed when a particle drifts off-screen.
      if (p.fx < -20) p.fx = cssW + 20; else if (p.fx > cssW + 20) p.fx = -20;
      if (p.fy < -20) p.fy = cssH + 20; else if (p.fy > cssH + 20) p.fy = -20;
    }

    // Bind book particles toward their closed/open target.
    if (p.book && ef > 0.001 && g) {
      const c = g.closed[i] || { x: p.fx, y: p.fy };
      const o = g.open[i] || c;
      const tx = lerp(c.x, o.x, eo);
      const ty = lerp(c.y, o.y, eo);
      p.rx = lerp(p.fx, tx, ef);
      p.ry = lerp(p.fy, ty, ef);
    } else {
      p.rx = p.fx; p.ry = p.fy;
    }

    // Breathing alpha, brightened while part of the book sketch.
    const breathe = 0.55 + 0.45 * Math.sin(flowT * p.aSpeed + p.aPhase);
    let a = p.aBase * breathe;
    if (p.book && ef > 0.001) a = lerp(a, 0.85 * breathe + 0.15, ef);
    ctx.globalAlpha = clamp(a, 0, 1);
    const s = p.size;
    ctx.fillRect(p.rx, p.ry, s, s);
  }

  // Draw and advance the abstract word-shapes.
  if (wordShapes.length) {
    for (let i = wordShapes.length - 1; i >= 0; i--) {
      const w = wordShapes[i];
      if (moving) w.age += dt;
      if (w.age >= w.life) { wordShapes.splice(i, 1); continue; }
      const t = w.age / w.life;
      const yy = w.y - w.rise * t * 3.4;
      const xx = w.x + Math.sin(w.sway + t * 4) * 10;
      const fade = Math.sin(Math.PI * t);          // in then out
      ctx.globalAlpha = clamp(fade * 0.5, 0, 1);
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "rgba(255,255,255,0.5)";
      ctx.shadowBlur = 10;
      const ww = w.w * (0.7 + 0.3 * (1 - t));
      ctx.fillRect(xx - ww / 2, yy, ww, w.h);
      ctx.shadowBlur = 0;
    }
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// Playback engine — pausable clock, cue lookup, text + director.
// ============================================================
let clock = 0;          // ms into the timeline
let lastClock = 0;
let paused = false;
let lastTS = null;
let fpsAccum = 0, fpsFrames = 0, fpsTimer = 0;

const elMarker = $("marker");
const elLine = $("line");
const elTitle = $("book-title");
const elCovers = $("covers");
let wordSpawned = wordSpawnTimes.map(() => false);

// Find the active cue for a given clock time (cues are contiguous).
function cueAt(ts) {
  for (let i = 0; i < cues.length; i++) {
    const c = cues[i];
    if (ts >= c.start && ts < c.start + c.dur) return c;
  }
  return cues[cues.length - 1];
}

// Apply text opacity for the active cue.
function renderText(cue) {
  const localT = clock - cue.start;

  // Chapter marker.
  if (cue.kind === "marker") {
    elMarker.textContent = cue.text;
    elMarker.style.opacity = envelope(localT, cue.inMs, cue.dur, cue.outMs);
  } else {
    elMarker.style.opacity = 0;
  }

  // Primary line / final line.
  if (cue.el === "line") {
    elLine.textContent = cue.text;
    elLine.classList.toggle("final", !!cue.final);
    elLine.style.opacity = envelope(localT, cue.inMs, cue.dur, cue.outMs);
  } else {
    elLine.style.opacity = 0;
  }

  // Beat 3 book title persists across the whole book sequence.
  if (clock >= bookTitleStart && clock <= bookTitleEnd) {
    elTitle.textContent = B.breakthrough.bookTitle;
    const lt = clock - bookTitleStart;
    const span = bookTitleEnd - bookTitleStart;
    elTitle.style.opacity = envelope(lt, T.bookTitleInMs, span, 900);
  } else {
    elTitle.style.opacity = 0;
  }

  // Beat 4 covers fade in staggered, then stay through the final line.
  if (clock >= coversStart && clock < coversEnd) {
    elCovers.style.opacity = 1;
    const lt = clock - coversStart;
    coverCards.forEach((card, idx) => {
      const start = idx * T.coverStaggerMs;
      card.style.opacity = clamp((lt - start) / T.coverFadeMs, 0, 1);
    });
  } else {
    elCovers.style.opacity = 0;
  }
}

// Main animation loop.
function frame(ts) {
  if (lastTS === null) lastTS = ts;
  let dt = ts - lastTS;
  lastTS = ts;
  dt = Math.min(dt, 50);          // clamp big gaps (inactive tab)

  if (!paused) {
    clock += dt;
    if (clock >= TOTAL) clock -= TOTAL;          // seamless loop

    // Reset transient state on loop or backward jump.
    if (clock < lastClock) {
      wordShapes = [];
      wordSpawned = wordSpawnTimes.map(() => false);
      released = false;
    }
    lastClock = clock;

    // Spawn Beat 3 word-shapes at their scheduled times.
    for (let i = 0; i < wordSpawnTimes.length; i++) {
      if (!wordSpawned[i] && clock >= wordSpawnTimes[i] && clock < wordSpawnTimes[i] + 400) {
        wordSpawned[i] = true;
        spawnWordShape();
      }
    }

    const cue = cueAt(clock);
    updateDirector(cue.director || "ambient", clock - cue.start, cue.dur, dt);
    renderText(cue);
    renderField(clock / 1000, dt, true);

    // Adaptive performance: scale particles down if the frame rate drops.
    fpsAccum += dt; fpsFrames++; fpsTimer += dt;
    if (fpsTimer >= 1000) {
      const fps = fpsFrames / (fpsAccum / 1000);
      if (fps < 45 && particles.length > 500) {
        particles.length = Math.max(500, Math.floor(particles.length * 0.85));
        bookCount = Math.min(bookCount, particles.length);
      }
      fpsAccum = 0; fpsFrames = 0; fpsTimer = 0;
    }
  } else {
    // Paused: redraw the frozen frame, advance nothing.
    renderField(clock / 1000, 0, false);
  }

  requestAnimationFrame(frame);
}

// ============================================================
// Beat 4 book covers — robust fetch with graceful fallback.
// ============================================================
const coverCards = [];
function buildCovers() {
  B.now.books.forEach((bk) => {
    const card = document.createElement("div");
    card.className = "cover";

    const frame = document.createElement("div");
    frame.className = "cover-frame";

    const img = document.createElement("img");
    img.alt = bk.title;

    const fb = document.createElement("div");
    fb.className = "cover-fallback";
    fb.innerHTML =
      '<div class="fb-title">' + bk.title + '</div>' +
      '<div class="fb-author">' + bk.author + '</div>';

    frame.appendChild(img);
    frame.appendChild(fb);

    if (bk.tag) {
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = bk.tag;
      frame.appendChild(tag);
    }

    const meta = document.createElement("div");
    meta.className = "cover-meta";
    meta.innerHTML =
      '<div class="c-title">' + bk.title + '</div>' +
      '<div class="c-author">' + bk.author + '</div>';

    card.appendChild(frame);
    card.appendChild(meta);
    elCovers.appendChild(card);
    coverCards.push(card);

    loadCover(img, fb, bk.isbn);
  });
}

// Try Open Library (large, then medium), then Google Books, then a CSS card.
function loadCover(img, fb, isbn) {
  const sources = [
    "https://covers.openlibrary.org/b/isbn/" + isbn + "-L.jpg?default=false",
    "https://covers.openlibrary.org/b/isbn/" + isbn + "-M.jpg?default=false"
  ];
  let idx = 0;

  function showFallback() {
    img.style.display = "none";
    fb.style.display = "flex";
  }
  function tryGoogleBooks() {
    fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:" + isbn)
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((data) => {
        const vi = data && data.items && data.items[0] && data.items[0].volumeInfo;
        const links = vi && vi.imageLinks;
        const url = links && (links.thumbnail || links.smallThumbnail);
        if (!url) return showFallback();
        img.onerror = showFallback;
        img.onload = null;
        img.src = url.replace("&zoom=1", "&zoom=2").replace("http://", "https://");
      })
      .catch(showFallback);
  }
  function next() {
    if (idx < sources.length) {
      img.src = sources[idx++];
    } else {
      tryGoogleBooks();
    }
  }
  img.onerror = next;
  // Open Library sometimes serves a 1px blank instead of a 404.
  img.onload = function () {
    if (img.naturalWidth <= 2 || img.naturalHeight <= 2) { next(); }
  };
  next();
}

// ============================================================
// Presenter controls — step between beats, pause everything.
// ============================================================
function currentBeatIndex() {
  let idx = 0;
  for (let i = 0; i < beats.length; i++) {
    if (clock >= beats[i].start) idx = i;
  }
  return idx;
}
function jumpToBeat(i) {
  const wrapped = (i + beats.length) % beats.length;
  clock = beats[wrapped].start;
  lastClock = clock;
  wordShapes = [];
  wordSpawned = wordSpawnTimes.map(() => false);
  released = false;
}
$("btnNext").addEventListener("click", () => jumpToBeat(currentBeatIndex() + 1));
$("btnPrev").addEventListener("click", () => {
  const i = currentBeatIndex();
  // Restart the current beat if we're well into it, else go to the previous.
  if (clock - beats[i].start > 2500) jumpToBeat(i);
  else jumpToBeat(i - 1);
});
$("btnPause").addEventListener("click", () => {
  paused = !paused;
  document.body.classList.toggle("paused", paused);
  $("btnPause").textContent = paused ? "Play" : "Pause";
});

// ============================================================
// Boot
// ============================================================
window.addEventListener("resize", resize);
resize();
buildCovers();
requestAnimationFrame(frame);
</script>
</body>
</html>
