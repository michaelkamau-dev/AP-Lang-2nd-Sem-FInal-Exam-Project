<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Year In AP Language</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Three.js (CDN only, scene 2 aftermath) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
  :root {
    --serif: 'Cormorant Garamond', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; color: #fff; }
  body { font-family: var(--serif); cursor: default; }

  #field { position: fixed; inset: 0; display: block; z-index: 0; transition: opacity 0.7s ease; }
  #three-stage { position: fixed; inset: 0; z-index: 1; opacity: 0; transition: opacity 0.7s ease; pointer-events: none; }

  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0) 40%, rgba(0,0,0,0.4) 80%, rgba(0,0,0,0.82) 100%);
  }

  #ui { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

  #marker {
    position: absolute; top: 34px; left: 38px;
    font-family: var(--mono); text-transform: uppercase;
    letter-spacing: 0.22em; font-size: clamp(13px, 1.2vw, 16px);
    color: rgba(255,255,255,0.5); opacity: 0; transition: opacity 0.8s ease;
  }
  #counter {
    position: absolute; bottom: 30px; right: 38px;
    font-family: var(--mono); letter-spacing: 0.18em;
    font-size: 12px; color: rgba(255,255,255,0.3);
    opacity: 0; transition: opacity 0.8s ease;
  }

  /* Title screen (Scene 1.A) */
  #titlescreen {
    position: absolute; left: 50%; top: 16%; transform: translateX(-50%);
    text-align: center; opacity: 0; transition: opacity 1.4s ease;
    pointer-events: none; max-width: 86vw;
  }
  #titlescreen .tt-title {
    font-family: var(--serif); font-style: italic;
    font-size: clamp(40px, 5.2vw, 78px); color: rgba(255,255,255,0.95);
    letter-spacing: 0.01em;
  }
  #titlescreen .tt-sub {
    font-family: var(--mono); text-transform: uppercase;
    letter-spacing: 0.28em; font-size: clamp(11px, 1vw, 14px);
    color: rgba(255,255,255,0.45); margin-top: 18px;
  }

  /* Scene 1.B essay images — plain pictures, no card chrome */
  #cards { position: absolute; inset: 0; pointer-events: none; }
  .ecard {
    position: absolute; width: 26vw; max-width: 360px;
    opacity: 0; transition: opacity 0.9s ease;
    display: flex; flex-direction: column; align-items: center;
  }
  .ecard .escan {
    display: none; width: 100%; max-height: 36vh; object-fit: contain;
    background: #fff;
    box-shadow: 0 0 50px rgba(255,255,255,0.08), 0 12px 36px rgba(0,0,0,0.65);
  }
  .ecard .efallback {
    font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.18em;
    font-size: clamp(13px, 1.2vw, 16px); color: rgba(255,255,255,0.55);
    padding: 60px 20px; text-align: center;
    border: 1px dashed rgba(255,255,255,0.18);
    width: 100%; min-height: 30vh;
    display: flex; align-items: center; justify-content: center;
  }
  .ecard .elabel {
    font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.22em;
    font-size: clamp(11px, 1vw, 14px); color: rgba(255,255,255,0.78);
    margin-top: 14px; text-align: center;
  }
  .ecard.has-img .escan { display: block; }
  .ecard.has-img .efallback { display: none; }
  #card0 { top: 8vh;  left: 5vw; }
  #card1 { top: 8vh;  right: 5vw; }
  #card2 { bottom: 8vh; left: 5vw; }
  #card3 { bottom: 8vh; right: 5vw; }

  /* Scene 1.B central tagline "my writing was bad." */
  #tagline {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-family: var(--serif); font-size: clamp(40px, 5.4vw, 82px);
    color: rgba(255,255,255,0.96); text-align: center;
    opacity: 0; transition: opacity 1.1s ease; pointer-events: none;
    text-shadow: 0 0 40px rgba(0,0,0,0.9);
  }
  #tagline .tag-red { color: #ff3a3a; }

  /* Scene 1.B problem-word cloud: flickering phrases around the tagline */
  #problems {
    position: absolute; inset: 0; pointer-events: none;
    opacity: 0; transition: opacity 0.8s ease;
  }
  #problems .pw {
    position: absolute; transform: translate(-50%, -50%);
    font-family: var(--serif); font-style: italic;
    color: rgba(255,255,255,0.55);
    white-space: nowrap;
    opacity: 0;
  }
  @keyframes pwFlicker {
    0%   { opacity: 0; }
    20%  { opacity: 0.55; }
    50%  { opacity: 0.85; }
    80%  { opacity: 0.45; }
    100% { opacity: 0; }
  }

  /* Scene 2: Hiroshima book-cover composition. Red sun + torii + heavy title. */
  #hirobook {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 1.6s ease;
  }
  #hirobook .hb-author {
    font-family: var(--mono); letter-spacing: 0.38em;
    font-size: clamp(11px, 1vw, 14px);
    color: rgba(255,255,255,0.62);
    margin-bottom: 26px;
  }
  #hirobook .hb-title {
    font-family: "Helvetica Neue", "Arial Black", Impact, sans-serif;
    font-weight: 900; letter-spacing: 0.14em;
    font-size: clamp(56px, 8.8vw, 124px); line-height: 1;
    color: #fff; margin-top: 28px;
    text-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  #hirobook .hb-sub {
    font-family: var(--mono); letter-spacing: 0.32em;
    font-size: clamp(10px, 0.9vw, 12px);
    color: rgba(255,255,255,0.5);
    margin-top: 22px;
  }
  #hirobook .hb-sun {
    position: relative;
    width: clamp(220px, 32vh, 360px);
    height: clamp(220px, 32vh, 360px);
    border-radius: 50%;
    background: radial-gradient(circle at 36% 34%, #ff5840 0%, #e02320 50%, #b0181a 100%);
    box-shadow:
      0 0 90px 4px rgba(220, 36, 28, 0.55),
      0 0 28px 0 rgba(255, 90, 72, 0.35),
      inset 0 -18px 50px rgba(120, 18, 18, 0.55);
    animation: hbSunPulse 4.5s ease-in-out infinite;
  }
  @keyframes hbSunPulse {
    0%, 100% { box-shadow: 0 0 90px 4px rgba(220, 36, 28, 0.55), 0 0 28px 0 rgba(255, 90, 72, 0.35), inset 0 -18px 50px rgba(120, 18, 18, 0.55); }
    50%      { box-shadow: 0 0 130px 10px rgba(220, 36, 28, 0.72), 0 0 40px 4px rgba(255, 110, 80, 0.45), inset 0 -18px 50px rgba(120, 18, 18, 0.55); }
  }
  #hirobook .hb-torii {
    position: absolute; left: 50%; top: 52%;
    transform: translate(-50%, -50%);
    width: 62%; height: 62%;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
  }

  /* Scene 2.C text */
  #hiro {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    text-align: center; max-width: 80vw; opacity: 0; transition: opacity 1.2s ease;
  }
  #hiro .hh {
    font-family: var(--serif); font-style: italic;
    font-size: clamp(40px, 4.6vw, 68px); color: rgba(255,255,255,0.96);
    margin-bottom: 44px; letter-spacing: -0.005em;
  }
  #hiro ul { list-style: none; display: inline-block; text-align: left; }
  #hiro li {
    font-family: var(--serif); font-size: clamp(22px, 2.1vw, 30px);
    color: rgba(255,255,255,0.82); line-height: 1.55;
    padding-left: 1.1em; text-indent: -1.1em; margin-bottom: 12px;
  }
  #hiro li::before { content: "— "; color: rgba(255,255,255,0.45); }
  #hiro .hc {
    font-family: var(--serif); font-style: italic;
    font-size: clamp(22px, 2.3vw, 30px); color: rgba(255,255,255,0.92);
    margin-top: 48px;
  }

  /* Scene 2.B: Hiroshima book-cover view + story bullets */
  #hirocover {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 6vw; opacity: 0; transition: opacity 1.2s ease;
    pointer-events: none;
  }
  #hirocover .hc-img {
    width: clamp(240px, 28vw, 380px);
    height: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.08);
    border-radius: 2px;
  }
  #hirocover .hc-text {
    max-width: 38vw;
  }
  #hirocover .hc-head {
    font-family: var(--serif); font-style: italic;
    font-size: clamp(28px, 3vw, 44px); color: rgba(255,255,255,0.95);
    margin-bottom: 32px; line-height: 1.2;
  }
  #hirocover .hc-list { list-style: none; }
  #hirocover .hc-list li {
    font-family: var(--serif); font-size: clamp(20px, 1.9vw, 28px);
    color: rgba(255,255,255,0.84); line-height: 1.5;
    padding-left: 1.2em; text-indent: -1.2em; margin-bottom: 16px;
  }
  #hirocover .hc-list li::before { content: "— "; color: rgba(255,255,255,0.5); }

  /* Scene 3 page text — positioned at the screen edges, OFF the book */
  .pagetext {
    position: absolute; opacity: 0; transition: opacity 1s ease; text-align: left;
    width: 28vw; max-width: 420px; top: 50%; transform: translateY(-50%);
  }
  #leftpage  { left: 5vw;  }
  #rightpage { right: 5vw; }
  .pagetext .ph {
    font-family: var(--serif); font-style: italic;
    font-size: clamp(24px, 2.6vw, 36px);
    color: rgba(255,255,255,0.95); margin-bottom: 28px;
    letter-spacing: -0.005em; line-height: 1.25;
  }
  .pagetext ul { list-style: none; }
  .pagetext li {
    font-family: var(--serif); font-size: clamp(19px, 1.9vw, 26px);
    color: rgba(255,255,255,0.84); line-height: 1.45; margin-bottom: 16px;
    padding-left: 1.1em; text-indent: -1.1em;
  }
  .pagetext li::before { content: "— "; color: rgba(255,255,255,0.5); }
  #sidepanel { display: none; }

  #book-title {
    position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
    font-family: var(--serif); font-style: italic;
    font-size: clamp(28px, 3vw, 44px); color: rgba(255,255,255,0.85);
    text-align: center; max-width: 80vw; opacity: 0; transition: opacity 1.1s ease;
  }

  #final {
    position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%);
    font-family: var(--serif); font-size: clamp(32px, 3.4vw, 50px);
    color: rgba(255,255,255,0.95); text-align: center; max-width: 84vw;
    opacity: 0; transition: opacity 1.4s ease;
  }

  /* Scene 5: credits scroll + black-hole fade overlay */
  #endfade {
    position: absolute; inset: 0; background: #000;
    opacity: 0; pointer-events: none;
    transition: opacity 1s ease;
    z-index: 4;
  }
  #credits {
    position: absolute; inset: 0; overflow: hidden;
    display: flex; justify-content: center;
    pointer-events: none; opacity: 0;
    transition: opacity 1.2s ease;
    z-index: 5;
  }
  #credits .cd-inner {
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%);
    text-align: center; max-width: 80vw;
    font-family: var(--serif);
    color: rgba(255,255,255,0.92);
    transition: transform linear;
  }
  #credits .cd-line {
    font-size: clamp(20px, 2vw, 28px);
    line-height: 1.7;
    margin: 8px 0;
  }
  #credits .cd-line.big {
    font-size: clamp(30px, 3.2vw, 44px);
    font-style: italic;
    margin: 28px 0;
    color: rgba(255,255,255,0.98);
  }
  #credits .cd-line.mono {
    font-family: var(--mono);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: clamp(13px, 1.1vw, 16px);
    color: rgba(255,255,255,0.7);
  }
  #credits .cd-line.dim { color: rgba(255,255,255,0.45); }
  #credits .cd-gap { height: 32px; }
  #credits .cd-gap.big { height: 80px; }

  #covers {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; gap: clamp(22px, 3.6vw, 60px);
    align-items: flex-start; justify-content: center;
    opacity: 0; transition: opacity 0.6s ease;
  }
  .cover { width: clamp(150px, 14.5vw, 224px); opacity: 0; transition: opacity 1.2s ease; }
  .cover-frame {
    position: relative; width: 100%; aspect-ratio: 2 / 3;
    border-radius: 3px; overflow: hidden;
    box-shadow: 0 0 60px rgba(255,255,255,0.06), 0 20px 60px rgba(0,0,0,0.8);
  }
  .cover-frame img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    filter: brightness(0.78) saturate(0.85) contrast(1.05);
  }
  .cover-frame::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0) 45%, rgba(0,0,0,0.5) 85%, rgba(0,0,0,0.8) 100%);
  }
  .cover-fallback {
    position: absolute; inset: 0; display: none;
    flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 14% 12%;
    background: linear-gradient(160deg, #16161b 0%, #0a0a0d 100%);
  }
  .cover-fallback .fb-title { font-family: var(--serif); font-size: clamp(15px,1.3vw,19px); line-height: 1.25; color: rgba(255,255,255,0.85); }
  .cover-fallback .fb-author { font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.16em; font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 10%; }
  .cover-meta { margin-top: 15px; text-align: center; }
  .cover-meta .c-title { font-family: var(--serif); font-weight: 500; font-size: clamp(15px,1.4vw,20px); color: rgba(255,255,255,0.92); line-height: 1.2; }
  .cover-meta .c-author { font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.14em; font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 7px; }
  .tag {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); text-transform: uppercase; font-variant: small-caps;
    letter-spacing: 0.18em; font-size: 11px; color: #fff;
    background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.16);
    padding: 5px 11px; border-radius: 2px;
    animation: tagPulse 2.4s ease-in-out infinite;
  }
  @keyframes tagPulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
  body.paused .tag { animation-play-state: paused; }
</style>
</head>
<body>

  <canvas id="field"></canvas>
  <div id="three-stage"></div>
  <div id="vignette"></div>

  <div id="ui">
    <div id="marker"></div>
    <div id="counter"></div>
    <div id="titlescreen">
      <div class="tt-title"></div>
      <div class="tt-sub"></div>
    </div>
    <div id="cards">
      <div class="ecard" id="card0"></div>
      <div class="ecard" id="card1"></div>
      <div class="ecard" id="card2"></div>
      <div class="ecard" id="card3"></div>
    </div>
    <div id="tagline"></div>
    <div id="problems"></div>
    <div id="hirobook">
      <div class="hb-author">JOHN HERSEY</div>
      <div class="hb-sun">
        <svg class="hb-torii" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- kasagi: top curved beam -->
          <path d="M 18 70 Q 100 56 182 70 L 178 86 L 22 86 Z" fill="#fff"/>
          <!-- nuki: second beam -->
          <rect x="34" y="94" width="132" height="13" fill="#fff"/>
          <!-- left pillar (slight outward slant toward base) -->
          <path d="M 52 107 L 60 107 L 64 178 L 46 178 Z" fill="#fff"/>
          <!-- right pillar -->
          <path d="M 140 107 L 148 107 L 154 178 L 136 178 Z" fill="#fff"/>
        </svg>
      </div>
      <div class="hb-title">HIROSHIMA</div>
      <div class="hb-sub">THE BOOK  /  READ FEBRUARY · 2ND SEMESTER</div>
    </div>
    <div id="hirocover">
      <img class="hc-img" alt="Hiroshima book cover">
      <div class="hc-text">
        <div class="hc-head"></div>
        <ul class="hc-list"></ul>
      </div>
    </div>
    <div id="hiro"></div>
    <div id="book-title"></div>
    <div class="pagetext" id="leftpage"></div>
    <div class="pagetext" id="rightpage"></div>
    <div id="sidepanel"></div>
    <div id="covers"></div>
    <div id="final"></div>
    <div id="credits"><div class="cd-inner"></div></div>
    <div id="endfade"></div>
  </div>

<script>
// ============================================================
// CONFIG — all on-screen text + scene parameters.
// ============================================================
const CONFIG = {
  text: {
    title: { line1: "My Year in AP Lang", line2: "Michael Kamau / AP Lang" },
    tagline: { before: "my writing was ", red: "bad." },
    problems: [
      "weak thesis", "no intro", "no conclusion", "buried the point",
      "walked the passage", "missed the claim", "skipped the context",
      "wrong document", "called them directionless", "drifted to today",
      "redundant", "comma splices", "double periods", "loose grammar",
      "too thin", "needs revision", "vague", "off topic"
    ],
    markers: ["01 / EARLY", "02 / HIROSHIMA", "03 / INDEPENDENT READING", "04 / NOW", "05 / END"],
    credits: [
      { t: "It's always fun to walk into class" },
      { t: "not really knowing what's on the agenda for the day." },
      { t: "", gap: 1 },
      { t: "AP Lang was definitely one of those classes." },
      { t: "", gap: 1 },
      { t: "From the in-class debates," },
      { t: "the class competitions," },
      { t: "the \u201Cwows\u201D and \u201Cwhoops,\u201D" },
      { t: "", gap: 1 },
      { t: "it quickly became my favorite class this year.", big: true },
      { t: "", gap: 2 },
      { t: "Thank you, Mr. Schleuter,", big: true },
      { t: "for the effort you put into making this course" },
      { t: "as interactive and enjoyable as it was." },
      { t: "", gap: 2 },
      { t: "—" },
      { t: "Michael Kamau", mono: true },
      { t: "the end", mono: true, dim: true }
    ],
    cards: [
      { img: "essays/mairs.png", label: "MAIRS  /  C+" },
      { img: "essays/mlk.png", label: "MLK  /  A-" },
      { img: "essays/clinton.png", label: "CLINTON  /  C" },
      { img: "essays/golden_breakthrough.png", label: "GOLDEN BREAKTHROUGH  /  B+" }
    ],
    hiro: {
      // Sub 1: actual book cover + what the book was like
      bookImg: "covers/hiroshima-book.jpg",
      bookHeader: "what the book was like.",
      bookBullets: [
        "Genuinely difficult to follow at times.",
        "Looked up more words than I read.",
        "Challenging rhetorical strategies to analyze."
      ],
      // Sub 2: reflection
      header: "this story humbled me.",
      bullets: [
        "I came in confident.",
        "I left knowing I wasn't ready.",
        "So I learned to read differently"
      ],
      closing: "We then had to choose a book."
    },
    bookTitle: "My Book: Narrative of the Life of Frederick Douglass",
    leftPage: {
      header: "I read this one with purpose.",
      bullets: [
        "Tracked the argument sentence by sentence.",
        "Marked every rhetorical move I caught.",
        "Stopped on words I didn't know."
      ]
    },
    rightPage: {
      header: "It changed how I read.",
      bullets: [
        "I was no longer reading passively.",
        "I became a detective while reading and it became fun."
      ]
    },
    side: { header: "", items: [] },
    finalPhrase: "AP Lang accelerated my love for reading.",
    counterTotal: "05",
    books: [
      { title: "The Rage of Innocence", author: "Kristin Henning",
        isbn: "9781524748906", src: "covers/rage-of-innocence.jpg" },
      { title: "Why Machines Learn: The Elegant Math Behind Modern AI",
        author: "Anil Ananthaswamy", isbn: "9780593185742" },
      { title: "Resist: 35 Profiles of Ordinary People Who Rose Up Against Tyranny and Injustice",
        author: "Veronica Chambers", isbn: "9780062796257", tag: "Currently Reading" }
    ]
  },
  scene: {
    introMs: 2000,
    ease: 0.04, alphaEase: 0.06,
    cardStaggerMs: 600, cardFadeMs: 900,
    sphere: { radiusFrac: 0.22, breatheMs: 6000, breatheAmt: 0.10, spin: 0.22, clear: 0.30 },
    hiro: { panMs: 3000, dolly: 0.05, clear: 0.30 },
    book: { heightFrac: 0.30, openMs: 1200, closeMs: 1200,
            rowsPerPage: 8, highlightOnMs: 1500, highlightFadeMs: 1000,
            wordRatePerSec: 3, wordRisePx: 250, wordLifeMs: 2600,
            shapeshiftMs: 1500, sideDelayMs: 2000, clear: 0.32 },
    vortex: { maxFrac: 0.55, squash: 0.62, clear: 0.12,
              coverDelayMs: 4000, coverStaggerMs: 600, coverFadeMs: 1200 },
    end: {
      clear: 0.18,
      burstMs: 1600,        // particles converging to form the black hole
      holdMs: 1800,         // black hole stable, before user advances
      diveMs: 2400,         // camera zooming into the hole
      fadeBlackMs: 800,     // pure black settle before credits
      creditsScrollMs: 32000 // credits scroll duration
    }
  }
};

// ============================================================
// Helpers
// ============================================================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const $ = (id) => document.getElementById(id);
const TAU = Math.PI * 2;

// ============================================================
// Canvas + particle field
// ============================================================
const canvas = $("field");
const ctx = canvas.getContext("2d");
const SC = CONFIG.scene;

let W = 0, H = 0, cx = 0, cy = 0, dpr = 1;
let particles = [];
let mainN = 0, ambN = 0, accN = 0;
let migrators = [];                 // scene 3.E shapeshift particles

function noiseX(x, y, t) { return Math.cos(x * 0.0015 + t * 0.21) + Math.sin((x + y) * 0.0010 - t * 0.17); }
function noiseY(x, y, t) { return Math.sin(y * 0.0016 - t * 0.19) + Math.cos((x - y) * 0.0011 + t * 0.15); }

// Build the particle set once, sized to viewport width.
function buildParticles() {
  const total = clamp(Math.round(window.innerWidth * 1.6), 1500, 2500);
  mainN = Math.floor(total * 0.6);
  ambN = Math.floor(total * 0.2);
  accN = total - mainN - ambN;
  particles = new Array(total);
  for (let i = 0; i < total; i++) {
    const role = i < mainN ? "main" : (i < mainN + ambN ? "ambient" : "accent");
    const p = {
      x: Math.random() * W, y: Math.random() * H,
      tx: 0, ty: 0, ta: 0, vx: 0, vy: 0,
      size: 0.6 + Math.random() * 1.5, alpha: 0, role,
      ph: Math.random() * TAU, sp: 0.5 + Math.random() * 0.8
    };
    if (role === "main") {
      const k = i;
      const phi = Math.acos(1 - 2 * (k + 0.5) / mainN);
      const th = Math.PI * (1 + Math.sqrt(5)) * (k + 0.5);
      p.sx = Math.sin(phi) * Math.cos(th);
      p.sy = Math.cos(phi);
      p.sz = Math.sin(phi) * Math.sin(th);
      p.va = Math.random() * TAU; p.vr = 0; p.vseed = Math.random();
      // Card slot (scene 1.B): which of 4 cards + spread perimeter param.
      p.cd = { card: k % 4, t: ((k * 0.61803) % 1), inner: (k % 6 === 0) };
      // Book role (scene 3): spine / perimeter edge / text row.
      p.bk = bookRole(k);
    }
    if (role === "accent") p.w = { on: false, age: 0, life: 0, vy: 0 };
    // Hiroshima scene color: ~28% of particles are red, the rest white.
    p.isRed = (Math.random() < 0.28);
    particles[i] = p;
  }
}

// Assign a stable book role so closed -> open is a clean hinge, not a morph.
function bookRole(k) {
  const m = k % 100;
  if (m < 20) return { kind: "spine", v: ((k * 53) % 1000) / 1000 };
  if (m < 56) {
    const side = (k % 2 === 0) ? -1 : 1;        // left / right page
    const e = k % 3;                            // 0 top, 1 bottom, 2 outer edge
    return { kind: "peri", side, edge: e, t: ((k * 29) % 1000) / 1000 };
  }
  const side = (k % 2 === 0) ? -1 : 1;
  const rows = SC.book.rowsPerPage;
  return { kind: "row", side, row: (Math.floor(k / 7) % rows),
           along: ((k * 17) % 1000) / 1000 };
}

function rectPoint(x0, y0, x1, y1, f) {
  const w = x1 - x0, h = y1 - y0, per = 2 * (w + h);
  let d = f * per;
  if (d < w) return { x: x0 + d, y: y0 };
  d -= w; if (d < h) return { x: x1, y: y0 + d };
  d -= h; if (d < w) return { x: x1 - d, y: y1 };
  d -= w; return { x: x0, y: y1 - d };
}

// ---- Scene target functions ----

// Scene 1.A: breathing, slowly spinning sphere.
function targetsForSphere(p, st) {
  const s = SC.sphere;
  const baseR = Math.min(W, H) * s.radiusFrac;
  const breathe = 1 + s.breatheAmt * Math.sin((st / s.breatheMs) * TAU);
  const ang = (st / 1000) * s.spin;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const x = p.sx * ca + p.sz * sa;
  const z = -p.sx * sa + p.sz * ca;
  const R = baseR * breathe;
  const j = 6 * Math.sin(st * 0.002 * p.sp + p.ph);
  p.tx = cx + x * R + j;
  p.ty = cy + p.sy * R + j * 0.7;
  p.ta = 0.22 + 0.55 * ((z + 1) / 2);
}

// Scene 1.B: four corner cards, particle-outlined.
function cardRects() {
  const mx = W * 0.05, my = H * 0.07;
  const cw = Math.min(W * 0.38, 560), ch = Math.min(H * 0.34, 320);
  return [
    { x0: mx, y0: my, x1: mx + cw, y1: my + ch },
    { x0: W - mx - cw, y0: my, x1: W - mx, y1: my + ch },
    { x0: mx, y0: H - my - ch, x1: mx + cw, y1: H - my },
    { x0: W - mx - cw, y0: H - my - ch, x1: W - mx, y1: H - my }
  ];
}
function targetsForCards(p) {
  const r = cardRects()[p.cd.card];
  if (p.cd.inner) {
    p.tx = lerp(r.x0, r.x1, 0.10 + (p.ph / TAU) * 0.80);
    p.ty = lerp(r.y0, r.y1, 0.10 + ((p.sp - 0.5) / 0.8) * 0.80);
    p.ta = 0.10;
  } else {
    const q = rectPoint(r.x0, r.y0, r.x1, r.y1, p.cd.t);
    p.tx = q.x; p.ty = q.y; p.ta = 0.7;
  }
}

// Scene 2 (Hiroshima): particles swirl around the red sun + drift radially outward.
// Some are RED (concentrated near the sun), some are WHITE (drifting outward).
// `panY` is added so the composition lifts away during 2.B pan-down.
let mushPanY = 0;
function targetsForHiroshima(p, st) {
  const sunCX = cx;
  const sunCY = cy;
  const sunR  = Math.min(W, H) * 0.18;                 // matches the CSS sun roughly
  const slowT = st / 1000;

  // Stable per-particle hash for role + orbit
  const hash = (p.ph * 7.31 + p.sp * 3.7) % 1;

  let tx, ty, ta;

  if (hash < 0.55) {
    // SWIRL: particles orbit at varying radii around the sun, slow rotation.
    const r0 = sunR * (1.05 + (p.sx + 1) * 0.95);      // 1.05x to 3.0x sun radius
    const angSpeed = 0.06 + (p.sp * 0.10);             // each particle slightly different
    const ang = p.ph * 1.7 + slowT * angSpeed;
    const wobble = Math.sin(slowT * 0.5 + p.ph * 3) * 8;
    tx = sunCX + Math.cos(ang) * (r0 + wobble);
    ty = sunCY + Math.sin(ang) * (r0 + wobble) * 0.82; // slight elliptical squash
    ta = 0.18 + 0.45 * Math.max(0, 1 - (r0 - sunR) / (sunR * 1.8));
  } else if (hash < 0.85) {
    // RADIAL EMBERS: particles emanate outward from the sun, looping back
    const ang = p.ph * TAU;
    const period = 4500 + p.sp * 4000;
    const t = ((st + p.ph * period) % period) / period;  // 0..1 cycle
    const rNow = sunR * (0.95 + t * 3.2);
    tx = sunCX + Math.cos(ang) * rNow;
    ty = sunCY + Math.sin(ang) * rNow * 0.9;
    ta = 0.35 * (1 - t);                                  // fade as they fly out
  } else {
    // FAR DRIFT: ambient particles scattered around the rest of the frame
    const f = st / 1000 * 0.18;
    const nx = Math.sin(p.ph * 2.3 + f) * Math.cos(p.ph * 1.7 - f * 0.6);
    const ny = Math.cos(p.ph * 1.9 + f * 0.8) * Math.sin(p.ph * 2.1 - f * 0.5);
    tx = sunCX + nx * W * 0.45;
    ty = sunCY + ny * H * 0.45;
    ta = 0.16;
  }

  // pan-down offset (rises out of frame for sub 1)
  p.tx = tx;
  p.ty = ty + mushPanY;
  p.ta = ta;
}

// Scene 3: hinge book. openAmt 0 = closed rectangle, 1 = two flat pages.
let bookOpenAmt = 0;
let highlightIdx = 0;
let leftLines = 1, rightLines = 1;       // ambient text-line visibility per page
function bookMetrics() {
  const bh = H * SC.book.heightFrac, bw = bh * 0.8;
  return { bh, bw, Tp: cy - bh / 2, Bp: cy + bh / 2, pw: bw, gap: 6, arc: bw * 0.10 };
}
function targetsForBook(p) {
  const e = bookOpenAmt;
  const M = bookMetrics();
  const bk = p.bk;
  if (bk.kind === "spine") {
    p.tx = cx; p.ty = lerp(M.Tp, M.Bp, bk.v);
    p.ta = 0.92;
    return;
  }
  const side = bk.side;
  const innerX = cx + side * lerp(0, M.gap, e);
  const outerX = cx + side * (lerp(M.bw / 2, M.pw, e) + Math.sin(Math.PI * e) * M.arc);
  if (bk.kind === "peri") {
    if (bk.edge === 0) { p.tx = lerp(innerX, outerX, bk.t); p.ty = M.Tp; }
    else if (bk.edge === 1) { p.tx = lerp(innerX, outerX, bk.t); p.ty = M.Bp; }
    else { p.tx = outerX; p.ty = lerp(M.Tp, M.Bp, bk.t); }
    p.ta = 0.85;
  } else {
    const x = lerp(innerX + side * M.bw * 0.05, outerX - side * M.bw * 0.05, bk.along);
    const y = lerp(M.Tp + M.bh * 0.12, M.Bp - M.bh * 0.12, bk.row / (SC.book.rowsPerPage - 1));
    p.tx = x; p.ty = y;
    const vis = side < 0 ? leftLines : rightLines;
    let a = 0.16 * vis;
    const total = SC.book.rowsPerPage * 2;
    const idx = (side < 0 ? bk.row : SC.book.rowsPerPage + bk.row);
    if (vis > 0.5 && e > 0.9 && idx === (highlightIdx % total)) a = 0.9;
    p.ta = a * (e > 0.5 ? 1 : 0);
  }
}

// Scene 4: rotating vortex, particles spiral inward and reseed.
function targetsForVortex(p, dt) {
  const v = SC.vortex;
  const maxR = Math.max(W, H) * v.maxFrac;
  if (p.vr <= 0) { p.vr = maxR * (0.55 + 0.45 * p.vseed); p.va = Math.random() * TAU; }
  const spd = 0.5 + 0.8 * (1 - p.vr / maxR);
  p.va += dt * 0.0009 * spd;
  p.vr -= dt * 0.012 * (0.5 + p.vseed);
  p.tx = cx + Math.cos(p.va) * p.vr;
  p.ty = cy + Math.sin(p.va) * p.vr * v.squash;
  p.ta = Math.sin(clamp(p.vr / maxR, 0, 1) * Math.PI) * 0.7;
  if (p.vr < maxR * 0.05) p.vr = 0;
}

// Scene 5: particles spiral inward and feed the black hole.
function targetsForBlackhole(p, st, intensity) {
  const focalX = W / 2;
  const focalY = H / 2;
  if (p.bhR === undefined) {
    p.bhR = Math.max(W, H) * (0.45 + 0.5 * p.vseed);
    p.bhA = Math.random() * TAU;
    p.bhSpd = 0.6 + p.vseed * 1.8;
  }
  // Spin rate accelerates as intensity grows (0..1).
  p.bhA += 0.0012 * p.bhSpd * (1 + intensity * 4);
  // Pull-in rate accelerates the same way.
  p.bhR -= 0.5 * (0.4 + p.vseed) * (1 + intensity * 6);
  if (p.bhR < 6) {
    p.bhR = Math.max(W, H) * (0.55 + 0.45 * Math.random());
    p.bhA = Math.random() * TAU;
  }
  p.tx = focalX + Math.cos(p.bhA) * p.bhR;
  p.ty = focalY + Math.sin(p.bhA) * p.bhR * 0.42;   // squash matches ring aspect
  // Brighter as they approach the throat.
  const closeness = 1 - clamp(p.bhR / (Math.max(W, H) * 0.6), 0, 1);
  p.ta = 0.25 + 0.6 * closeness;
}

// Scene 5: wireframe wormhole — viewer looks down into a throat at screen center.
// Rings are concentric ellipses; brighter (closer) outward, dim/dark at the center.
// `zoom` > 1 simulates camera diving in (rings expand toward the edges).
function drawBlackhole(ctx2, fadeIn, zoom) {
  const focalX = W / 2;
  const focalY = H / 2;
  const N = 22;
  const RADIALS = 24;
  const rMax = Math.min(W, H) * 0.95 * zoom;
  const rMin = 16 * zoom;
  // Ring radii, exponential spacing so they pack toward the throat
  const rings = [];
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);                 // 0 outer, 1 inner
    const eased = Math.pow(t, 1.8);         // perspective compression near center
    const rx = lerp(rMax, rMin, eased);
    const ry = rx * 0.42;                   // viewer-tilted, somewhat flattened
    const dimness = eased;                  // 0 outer ring (bright) -> 1 inner (dark)
    rings.push({ rx, ry, dimness });
  }
  ctx2.save();
  // Radial spokes connect every angle across every ring
  ctx2.lineWidth = 0.7;
  for (let j = 0; j < RADIALS; j++) {
    const ang = (j / RADIALS) * TAU;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    ctx2.beginPath();
    for (let i = 0; i < N; i++) {
      const r = rings[i];
      const x = focalX + ca * r.rx;
      const y = focalY + sa * r.ry;
      if (i === 0) ctx2.moveTo(x, y); else ctx2.lineTo(x, y);
    }
    ctx2.strokeStyle = "rgba(255,255,255," + (0.22 * fadeIn).toFixed(3) + ")";
    ctx2.stroke();
  }
  // Rings, dimmer toward the throat
  ctx2.lineWidth = 0.9;
  for (const r of rings) {
    const a = (1 - r.dimness * 0.92) * fadeIn * 0.7;
    ctx2.strokeStyle = "rgba(255,255,255," + a.toFixed(3) + ")";
    ctx2.beginPath();
    ctx2.ellipse(focalX, focalY, r.rx, r.ry, 0, 0, TAU);
    ctx2.stroke();
  }
  // Void at the throat
  ctx2.fillStyle = "rgba(0,0,0," + fadeIn.toFixed(3) + ")";
  ctx2.beginPath();
  ctx2.ellipse(focalX, focalY, rMin * 1.05, rMin * 1.05 * 0.42, 0, 0, TAU);
  ctx2.fill();
  ctx2.restore();
}

function ambientDrift(p, simS) {
  p.vx += noiseX(p.x, p.y, simS) * 0.010;
  p.vy += noiseY(p.x, p.y, simS) * 0.010;
  p.vx *= 0.95; p.vy *= 0.95;
  p.x += p.vx; p.y += p.vy;
  if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
  if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;
  p.ta = 0.10 + 0.16 * (0.5 + 0.5 * Math.sin(simS * p.sp + p.ph));
}

// Scene 3 continuous word-stream (3 clusters/sec).
let wordAcc = 0;
function spawnWordCluster() {
  const M = bookMetrics();
  const side = Math.random() < 0.5 ? -1 : 1;
  const pageW = M.pw;
  const bx = cx + side * (M.gap + Math.random() * pageW * 0.92);
  const by = cy + (Math.random() - 0.3) * M.bh * 0.4;
  const width = 40 + Math.random() * 40;
  const life = SC.book.wordLifeMs * (0.85 + Math.random() * 0.4);
  let need = 9 + Math.floor(Math.random() * 5);
  for (let i = mainN + ambN; i < particles.length && need > 0; i++) {
    const p = particles[i];
    if (p.w.on) continue;
    p.w.on = true; p.w.age = 0; p.w.life = life;
    p.w.vy = SC.book.wordRisePx / life;
    p.x = bx + (Math.random() - 0.5) * width;
    p.y = by + (Math.random() - 0.5) * 6;
    p.alpha = 0; need--;
  }
}
function updateWordParticle(p, dt) {
  const w = p.w;
  if (!w.on) { p.ta = 0; p.alpha *= 0.9; return; }
  w.age += dt;
  if (w.age >= w.life) { w.on = false; p.ta = 0; return; }
  const t = w.age / w.life;
  p.y -= w.vy * dt;
  p.x += Math.sin(t * 5 + p.ph) * 0.4;
  p.ta = Math.sin(t * Math.PI) * 0.55;
  p.alpha = p.ta;
}

// Three.js — scene 2 Hiroshima aftermath
// ============================================================
let three = null;     // { renderer, scene, camera, cloud, embers, ruins, basePitch }
function mountThree() {
  if (three || typeof THREE === "undefined") return;
  const host = $("three-stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H);
  host.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05050a);
  scene.fog = new THREE.FogExp2(0x0b0b12, 0.011);

  const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 900);
  camera.position.set(0, 7, 52);
  const basePitch = -0.10;
  camera.rotation.x = basePitch;

  // Ash haze gradient backdrop.
  const gc = document.createElement("canvas");
  gc.width = 4; gc.height = 256;
  const g2 = gc.getContext("2d");
  const grad = g2.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, "#0a0a12");
  grad.addColorStop(0.62, "#15151c");
  grad.addColorStop(1, "#070709");
  g2.fillStyle = grad; g2.fillRect(0, 0, 4, 256);
  const bgTex = new THREE.CanvasTexture(gc);
  const sky = new THREE.Mesh(
    new THREE.PlaneGeometry(1400, 700),
    new THREE.MeshBasicMaterial({ map: bgTex, depthWrite: false, fog: false }));
  sky.position.set(0, 120, -420);
  scene.add(sky);

  // Scorched ground.
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(1600, 1600),
    new THREE.MeshBasicMaterial({ color: 0x0c0c11 }));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // Mid-distance flattened ruins (impressionistic broken skeletons).
  const ruins = new THREE.Group();
  const rmat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.13 });
  for (let i = 0; i < 90; i++) {
    const w = 1.4 + Math.random() * 5;
    const h = 1.2 + Math.random() * 7;
    const d = 1.4 + Math.random() * 5;
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), rmat);
    const lane = (Math.random() < 0.5 ? -1 : 1);
    b.position.set(lane * (6 + Math.random() * 70), h / 2,
                   -20 - Math.random() * 230);
    b.rotation.y = Math.random() * 0.5;
    ruins.add(b);
  }
  scene.add(ruins);

  // Far mushroom cloud (suspended white particles, slowly expanding).
  const N = 1700;
  const cpos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    let rx, ry, rz;
    if (i < N * 0.45) {                       // stem
      const a = Math.random() * TAU, rr = Math.random() * 7;
      rx = Math.cos(a) * rr; rz = Math.sin(a) * rr;
      ry = 4 + Math.random() * 46;
    } else {                                  // cap
      const a = Math.random() * TAU;
      const rr = 14 + Math.random() * 30;
      rx = Math.cos(a) * rr; rz = Math.sin(a) * rr * 0.8;
      ry = 50 + Math.random() * 34 - (rr * 0.3);
    }
    cpos[i * 3] = rx; cpos[i * 3 + 1] = ry; cpos[i * 3 + 2] = rz;
  }
  const cgeo = new THREE.BufferGeometry();
  cgeo.setAttribute("position", new THREE.BufferAttribute(cpos, 3));
  const cloud = new THREE.Points(cgeo, new THREE.PointsMaterial({
    color: 0xffffff, size: 1.5, transparent: true, opacity: 0.38,
    sizeAttenuation: true, depthWrite: false }));
  cloud.position.set(0, 8, -300);
  scene.add(cloud);

  // Slow-rising embers.
  const EN = 240;
  const epos = new Float32Array(EN * 3);
  const espd = new Float32Array(EN);
  for (let i = 0; i < EN; i++) {
    epos[i * 3] = (Math.random() - 0.5) * 200;
    epos[i * 3 + 1] = Math.random() * 40;
    epos[i * 3 + 2] = -10 - Math.random() * 240;
    espd[i] = 0.4 + Math.random() * 1.2;
  }
  const egeo = new THREE.BufferGeometry();
  egeo.setAttribute("position", new THREE.BufferAttribute(epos, 3));
  const embers = new THREE.Points(egeo, new THREE.PointsMaterial({
    color: 0xffffff, size: 0.7, transparent: true, opacity: 0.5,
    sizeAttenuation: true, depthWrite: false }));
  scene.add(embers);

  three = { renderer, scene, camera, cloud, embers, espd, basePitch };
}
function renderThree(dt, sub, st) {
  if (!three) return;
  const t = three;
  // Ambient slow forward dolly.
  t.camera.position.z -= SC.hiro.dolly * (dt / 1000);
  // Embers drift up and recycle.
  const pa = t.embers.geometry.attributes.position;
  for (let i = 0; i < t.espd.length; i++) {
    pa.array[i * 3 + 1] += t.espd[i] * (dt / 1000) * 3;
    if (pa.array[i * 3 + 1] > 60) pa.array[i * 3 + 1] = 0;
  }
  pa.needsUpdate = true;
  t.cloud.scale.setScalar(1 + Math.min(st, 60000) * 0.0000025 + 1e-6);
  // Scene 2.B pan-down.
  if (sub >= 1) {
    const k = easeIO(clamp(st / SC.hiro.panMs, 0, 1));
    t.camera.rotation.x = lerp(t.basePitch, -1.08, k);
  } else {
    t.camera.rotation.x = t.basePitch;
  }
  t.renderer.render(t.scene, t.camera);
}
function disposeThree() {
  if (!three || scene === 1) return;   // skip if we navigated back to scene 2
  const host = $("three-stage");
  three.scene.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (o.material.map) o.material.map.dispose();
      o.material.dispose();
    }
  });
  three.renderer.dispose();
  if (three.renderer.domElement.parentNode === host) host.removeChild(three.renderer.domElement);
  three = null;
}

let lastTS = null, fpsAcc = 0, fpsFrames = 0;

const subCount = [2, 3, 4, 1, 3];   // subs per scene (scene 4: hole forms, dive, credits)

const elMarker = $("marker"), elCounter = $("counter"), elTitle = $("book-title");
const elFinal = $("final"), elCovers = $("covers"), elHiro = $("hiro");
const elLeft = $("leftpage"), elRight = $("rightpage"), elSide = $("sidepanel");
const elTitleScreen = $("titlescreen"), elTagline = $("tagline"), elHirobook = $("hirobook");

const elCredits = $("credits"), elCreditsInner = elCredits.querySelector(".cd-inner");
const elEndfade = $("endfade");

function setSub(s) { sub = s; subT0 = simT; updateUI(); }
function gotoScene(i, s) {
  const wasThree = (scene === 1);
  scene = clamp(i, 0, 4);
  sub = s || 0;
  sceneT0 = simT; subT0 = simT;
  closing = false; coverStart = -1; migrators = [];
  for (let k = mainN + ambN; k < particles.length; k++) particles[k].w.on = false;
  applyThree(wasThree);
  updateUI();
}
// Three.js is no longer used. Scene 2 (Hiroshima) renders as a 2D canvas mushroom cloud.
function applyThree(wasThree) {
  $("three-stage").style.opacity = 0;
  canvas.style.opacity = 1;
  if (wasThree) setTimeout(disposeThree, 100);
}

function advance() {
  if (phase === "intro") { phase = "scene"; scene = 0; sub = 0; sceneT0 = subT0 = simT; updateUI(); return; }
  if (scene === 0) { sub === 0 ? setSub(1) : gotoScene(1, 0); return; }
  if (scene === 1) {
    if (sub < 2) { setSub(sub + 1); return; }
    gotoScene(2, 0); return;
  }
  if (scene === 2) {
    if (sub < 3) { setSub(sub + 1); return; }
    if (!closing) { closing = true; closeT0 = simT; }   // close then scene 4
    return;
  }
  if (scene === 3) {
    if (coverStart < 0) { coverStart = simT; updateUI(); return; }
    gotoScene(4, 0); return;
  }
  if (scene === 4) {
    if (sub < 2) { setSub(sub + 1); return; }
    return;  // last scene; stay here
  }
}
function back() {
  if (phase === "intro") return;
  if (scene === 0) { if (sub > 0) setSub(0); return; }
  if (scene === 1) { sub > 0 ? setSub(sub - 1) : gotoScene(0, 1); return; }
  if (scene === 2) { sub > 0 ? setSub(sub - 1) : gotoScene(1, 0); closing = false; return; }
  if (scene === 3) {
    if (coverStart >= 0) { coverStart = -1; updateUI(); }
    else gotoScene(2, 3);
    return;
  }
  if (scene === 4) {
    if (sub > 0) { setSub(sub - 1); return; }
    gotoScene(3, 0); coverStart = simT; updateUI(); return;
  }
}
function restart() {
  simT = sceneT0 = subT0 = 0; scene = 0; sub = 0; phase = "scene";
  closing = false; coverStart = -1; migrators = [];
  for (let k = mainN + ambN; k < particles.length; k++) particles[k].w.on = false;
  applyThree(true);
  updateUI();
}

// Scene 3 page text now lives at the screen edges (set in CSS), so no per-frame layout is needed.
function layoutPageText() { /* CSS-positioned */ }

// Build DOM text from CONFIG.
function buildText() {
  // Title screen
  const t = CONFIG.text.title;
  document.querySelector("#titlescreen .tt-title").textContent = t.line1;
  document.querySelector("#titlescreen .tt-sub").textContent = t.line2;
  // Tagline ("my writing was bad.")
  const tg = CONFIG.text.tagline;
  elTagline.innerHTML = tg.before + '<span class="tag-red">' + tg.red + '</span>';
  // Essay images — plain pictures with text label fallback if missing
  CONFIG.text.cards.forEach((c, i) => {
    const el = $("card" + i);
    el.innerHTML =
      '<img class="escan" alt="">' +
      '<div class="efallback">' + c.label + '</div>' +
      '<div class="elabel">' + c.label + '</div>';
    if (c.img) {
      const im = el.querySelector(".escan");
      im.onload = () => { if (im.naturalWidth > 2) el.classList.add("has-img"); };
      im.onerror = () => { el.classList.remove("has-img"); };
      im.src = c.img;
    }
  });
  // Problem-word cloud: build spans scattered around the center, each with its own flicker timing.
  // Avoid the central tagline box (roughly 40vw x 18vh around screen center).
  const probs = CONFIG.text.problems;
  // Stable scatter — same positions every render so layout doesn't jump.
  let seed = 17;
  const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  elProblems.innerHTML = probs.map((p, i) => {
    // Pick a position outside a central tagline-safe rectangle.
    let cx, cy;
    for (let tries = 0; tries < 20; tries++) {
      cx = 8 + rand() * 84;   // 8vw .. 92vw
      cy = 12 + rand() * 76;  // 12vh .. 88vh
      const dx = Math.abs(cx - 50), dy = Math.abs(cy - 50);
      if (dx > 24 || dy > 12) break;  // outside the tagline box
    }
    const size = 18 + Math.floor(rand() * 14);  // 18-32px
    const delay = (rand() * 6).toFixed(2);
    const dur = (4 + rand() * 4).toFixed(2);
    const rot = ((rand() * 8) - 4).toFixed(1);
    return '<span class="pw" style="left:' + cx.toFixed(2) + 'vw;top:' + cy.toFixed(2) +
           'vh;font-size:' + size + 'px;transform:translate(-50%,-50%) rotate(' + rot +
           'deg);animation:pwFlicker ' + dur + 's ease-in-out ' + delay +
           's infinite;">' + p + '</span>';
  }).join("");
  const h = CONFIG.text.hiro;
  elHiro.innerHTML = '<div class="hh">' + h.header + '</div><ul>' +
    h.bullets.map((b) => "<li>" + b + "</li>").join("") +
    '</ul><div class="hc">' + h.closing + "</div>";
  // Hiroshima book-cover sub (sub 1): cover image + story bullets
  const hcImg = elHirocover.querySelector(".hc-img");
  hcImg.onerror = () => { hcImg.style.opacity = 0; };
  hcImg.src = h.bookImg;
  elHirocover.querySelector(".hc-head").textContent = h.bookHeader;
  elHirocover.querySelector(".hc-list").innerHTML =
    h.bookBullets.map((b) => "<li>" + b + "</li>").join("");
  const lp = CONFIG.text.leftPage, rp = CONFIG.text.rightPage, sd = CONFIG.text.side;
  elLeft.innerHTML = '<div class="ph">' + lp.header + '</div><ul>' +
    lp.bullets.map((b) => "<li>" + b + "</li>").join("") + "</ul>";
  elRight.innerHTML = '<div class="ph">' + rp.header + '</div><ul>' +
    rp.bullets.map((b) => "<li>" + b + "</li>").join("") + "</ul>";
  elSide.innerHTML = '<div class="sh">' + sd.header + '</div><ul>' +
    sd.items.map((b) => "<li>" + b + "</li>").join("") + "</ul>";
  elTitle.textContent = CONFIG.text.bookTitle;
  elFinal.textContent = CONFIG.text.finalPhrase;
  // Credits roll (scene 5)
  elCreditsInner.innerHTML = CONFIG.text.credits.map((c) => {
    if (!c.t && c.gap) {
      return '<div class="cd-gap' + (c.gap > 1 ? ' big' : '') + '"></div>';
    }
    const cls = ["cd-line"];
    if (c.big)  cls.push("big");
    if (c.mono) cls.push("mono");
    if (c.dim)  cls.push("dim");
    return '<div class="' + cls.join(" ") + '">' + c.t + '</div>';
  }).join("");
}

// Show the right overlay for the active scene/sub.
function updateUI() {
  const onScene = phase === "scene";
  const showMarker = onScene && !(scene === 0 && sub === 1);
  elMarker.textContent = onScene ? CONFIG.text.markers[scene] : "";
  elMarker.style.opacity = showMarker ? 1 : 0;
  elCounter.textContent = onScene
    ? String(scene + 1).padStart(2, "0") + " / " + CONFIG.text.counterTotal : "";
  elCounter.style.opacity = onScene ? 1 : 0;

  for (let i = 0; i < 4; i++) $("card" + i).style.opacity = 0;
  elHiro.style.opacity = 0;
  if (!(onScene && scene === 1)) elHirobook.style.opacity = 0;
  if (!(onScene && scene === 1 && sub === 1)) elHirocover.style.opacity = 0;
  // Title screen: visible on Scene 1.A (scene 0, sub 0) and during intro
  elTitleScreen.style.opacity = (phase === "intro" || (onScene && scene === 0 && sub === 0)) ? 1 : 0;
  // Tagline ("my writing was bad."): visible on Scene 1.B (scene 0, sub 1)
  elTagline.style.opacity = (onScene && scene === 0 && sub === 1) ? 1 : 0;
  // Problem-word cloud: same scope as tagline
  if (!(onScene && scene === 0 && sub === 1)) elProblems.style.opacity = 0;
  elTitle.style.opacity = (onScene && scene === 2) ? 1 : 0;
  if (!(onScene && scene === 2 && sub >= 2)) elLeft.style.opacity = 0;
  if (!(onScene && scene === 2 && sub >= 3)) elRight.style.opacity = 0;
  if (!(onScene && scene === 2 && sub === 3)) elSide.style.opacity = 0;
  elCovers.style.opacity = (onScene && scene === 3 && coverStart >= 0) ? 1 : 0;
  if (!(onScene && scene === 3 && coverStart >= 0)) {
    elFinal.style.opacity = 0;
    coverCards.forEach((c) => (c.style.opacity = 0));
  }
  // Scene 5 (end): credits and fade are driven by the frame loop instead.
  // Reset them only when we leave scene 4.
  if (!(onScene && scene === 4)) {
    elCredits.style.opacity = 0;
    elEndfade.style.opacity = 0;
    elCreditsInner.style.transition = "none";
    elCreditsInner.style.transform = "translateX(-50%)";
  }
}

// ============================================================
// Main loop
// ============================================================
function frame(ts) {
  if (lastTS === null) lastTS = ts;
  let dt = ts - lastTS; lastTS = ts;
  dt = Math.min(dt, 50);
  if (!paused) simT += dt;
  const st = simT - subT0;
  const simS = simT / 1000;

  if (phase === "intro" && !paused && simT > SC.introMs) {
    phase = "scene"; scene = 0; sub = 0; sceneT0 = subT0 = simT; updateUI();
  }

  // Scene 2 (Hiroshima). Sub 0 = red-sun title screen. Sub 1 = book-cover view + bullets.
  // Sub 2 = pan out and "this story humbled me" reflection.
  if (phase === "scene" && scene === 1) {
    if (sub === 0) {
      elHirobook.style.opacity = clamp((simT - sceneT0 - 400) / 1400, 0, 1);
      elHirocover.style.opacity = 0;
      mushPanY += (0 - mushPanY) * 0.08;
      elHiro.style.opacity = 0;
    } else if (sub === 1) {
      elHirobook.style.opacity = Math.max(0, 1 - st / 400);
      elHirocover.style.opacity = clamp((st - 300) / 1100, 0, 1);
      mushPanY += (0 - mushPanY) * 0.08;
      elHiro.style.opacity = 0;
    } else if (sub === 2) {
      elHirobook.style.opacity = 0;
      elHirocover.style.opacity = Math.max(0, 1 - st / 500);
      const k = easeIO(clamp(st / SC.hiro.panMs, 0, 1));
      mushPanY = -k * H * 0.9;
      elHiro.style.opacity = (st > SC.hiro.panMs * 0.6) ? 1 : 0;
    }
  } else {
    elHirobook.style.opacity = 0;
    elHirocover.style.opacity = 0;
  }

  // Canvas clear-alpha (motion-blur trail) per scene.
  let clearA = 0.20;
  if (phase === "scene") clearA = [SC.sphere.clear, 0.3, SC.book.clear, SC.vortex.clear, SC.end.clear][scene];
  ctx.fillStyle = "rgba(0,0,0," + clearA + ")";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#fff";

  // Scene 3 timing: open / close hinge, highlight, page-line visibility.
  if (phase === "scene" && scene === 2) {
    if (closing) {
      const k = easeIO(clamp((simT - closeT0) / SC.book.closeMs, 0, 1));
      bookOpenAmt = 1 - k;
      // Wait a full hold-time after the book is closed before moving to scene 4, so the close reads cleanly.
      if (k >= 1 && (simT - closeT0) > SC.book.closeMs + 600) { gotoScene(3, 0); }
    } else if (sub === 0) {
      bookOpenAmt += (0 - bookOpenAmt) * 0.12;
    } else {
      const k = easeOut(clamp((simT - (scene === 2 && sub === 1 ? subT0 : sceneT0)) / SC.book.openMs, 0, 1));
      bookOpenAmt = sub === 1 ? k : 1;
    }
    const b = SC.book;
    if (bookOpenAmt > 0.9) {
      const slot = b.highlightOnMs + b.highlightFadeMs;
      highlightIdx = Math.floor((simT - sceneT0) / slot);
    }
    // Left/right ambient line visibility by sub-state.
    const tgtL = (sub === 2) ? 0 : 1;
    const tgtR = (sub >= 3) ? 0 : 1;
    leftLines += (tgtL - leftLines) * 0.08;
    rightLines += (tgtR - rightLines) * 0.08;
    // Continuous word stream while the book is open.
    if (!paused && bookOpenAmt > 0.9) {
      wordAcc += dt;
      const iv = 1000 / b.wordRatePerSec;
      while (wordAcc >= iv) { spawnWordCluster(); wordAcc -= iv; }
    }
    // 3.E shapeshift: spawn migrators once when entering sub 3.
    if (sub === 3 && !closing && migrators.length === 0 && st < 80) spawnMigrators();
  }

  // Update + draw particles.
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (p.role === "ambient") {
      if (!paused) ambientDrift(p, simS);
    } else if (p.role === "accent") {
      if (phase === "scene" && scene === 2 && bookOpenAmt > 0.9) {
        if (!paused) updateWordParticle(p, dt);
      } else { p.w.on = false; if (!paused) ambientDrift(p, simS); }
    } else if (!paused) {
      if (phase === "intro") ambientDrift(p, simS);
      else {
        if (scene === 0) {
          if (sub === 0) targetsForSphere(p, simT - sceneT0);
          else {
            // Scene 1.B: scatter what was the sphere across the whole canvas, low alpha.
            // The flickering problem words become the focal point instead.
            const a = p.ph * 13.7 + p.sp * 4.3;
            p.tx = W * (0.04 + ((Math.sin(a) + 1) / 2) * 0.92);
            p.ty = H * (0.04 + ((Math.cos(a * 1.7) + 1) / 2) * 0.92);
            p.ta = 0.08 + 0.10 * (0.5 + 0.5 * Math.sin((simT / 1000) * p.sp + p.ph));
          }
        }
        else if (scene === 1) targetsForHiroshima(p, simT - sceneT0);
        else if (scene === 2) targetsForBook(p);
        else if (scene === 3) targetsForVortex(p, dt);
        else if (scene === 4) {
          // Intensity ramps from 0 to 1 over the burst, stays high through dive, fades during credits.
          let intensity = 0;
          if (sub === 0) intensity = clamp(st / SC.end.burstMs, 0, 1);
          else if (sub === 1) intensity = 1;
          else intensity = Math.max(0, 1 - st / 800);
          targetsForBlackhole(p, st, intensity);
        }
        else ambientDrift(p, simS);
        p.x += (p.tx - p.x) * SC.ease;
        p.y += (p.ty - p.y) * SC.ease;
      }
    }
    if (!paused) p.alpha += (p.ta - p.alpha) * SC.alphaEase;
    if (p.alpha > 0.003) {
      ctx.globalAlpha = clamp(p.alpha, 0, 1);
      // Hiroshima scene: tint some particles red. Other scenes stay white.
      if (phase === "scene" && scene === 1 && p.isRed) {
        ctx.fillStyle = "#ff4030";
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.fillStyle = "#fff";
      } else {
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
    }
  }
  ctx.globalAlpha = 1;

  // Scene 3.E shapeshift particles flying across the spine.
  if (migrators.length) {
    for (let i = migrators.length - 1; i >= 0; i--) {
      const m = migrators[i];
      if (!paused) m.age += dt;
      const k = clamp(m.age / m.life, 0, 1);
      const e = easeIO(k);
      const mx = lerp(m.x0, m.x1, e);
      const my = lerp(m.y0, m.y1, e) - Math.sin(Math.PI * k) * m.arc;
      ctx.globalAlpha = Math.sin(Math.PI * k) * 0.7;
      ctx.fillRect(mx, my, 1.6, 1.6);
      if (k >= 1) migrators.splice(i, 1);
    }
    ctx.globalAlpha = 1;
  }

  // Scene 1.B card stagger + tagline + flickering problem-words.
  if (phase === "scene" && scene === 0 && sub === 1) {
    for (let i = 0; i < 4; i++) {
      $("card" + i).style.opacity =
        clamp((st - i * SC.cardStaggerMs) / SC.cardFadeMs, 0, 1);
    }
    // Tagline fades in slightly after the cards start landing.
    elTagline.style.opacity = clamp((st - 1500) / 1400, 0, 1);
    // Problem-word cloud fades in after the tagline lands.
    elProblems.style.opacity = clamp((st - 3000) / 1500, 0, 1);
  }

  // Scene 3 page reveals + side panel timing.
  if (phase === "scene" && scene === 2) {
    if (closing) {
      // Once closing starts, fade out all the text overlays so the close reads clean.
      elLeft.style.opacity = 0;
      elRight.style.opacity = 0;
      elSide.style.opacity = 0;
      elTitle.style.opacity = 0;
    } else {
      elLeft.style.opacity = (sub === 2) ? 1 : 0;
      if (sub >= 3) {
        const ss = SC.book.shapeshiftMs;
        elRight.style.opacity = clamp((st - ss * 0.55) / 900, 0, 1);
        elSide.style.opacity = clamp((st - (ss + SC.book.sideDelayMs)) / 1100, 0, 1);
      }
    }
  }

  // Scene 4 cover reveal (timed, or forced by advance).
  if (phase === "scene" && scene === 3) {
    if (coverStart < 0 && !paused && (simT - sceneT0) > SC.vortex.coverDelayMs) {
      coverStart = simT; updateUI();
    }
    if (coverStart >= 0) {
      elCovers.style.opacity = 1;
      const cT = simT - coverStart;
      coverCards.forEach((card, idx) => {
        card.style.opacity = clamp((cT - idx * SC.vortex.coverStaggerMs) / SC.vortex.coverFadeMs, 0, 1);
      });
      const settled = (coverCards.length - 1) * SC.vortex.coverStaggerMs + SC.vortex.coverFadeMs + 500;
      elFinal.style.opacity = cT > settled ? 1 : 0;
    }
  }

  // Scene 5 (end): black hole forms, camera dives in, credits scroll.
  if (phase === "scene" && scene === 4) {
    const end = SC.end;
    let fadeIn = 0, zoom = 1, blackOverlay = 0;
    if (sub === 0) {
      // Burst → black hole stabilizes
      fadeIn = clamp(st / end.burstMs, 0, 1);
      zoom = 1.0;
      blackOverlay = 0;
    } else if (sub === 1) {
      // Dive into the hole
      const k = easeIO(clamp(st / end.diveMs, 0, 1));
      fadeIn = 1;
      zoom = 1 + k * 5.2;
      blackOverlay = clamp((st - end.diveMs * 0.55) / end.fadeBlackMs, 0, 1);
    } else if (sub === 2) {
      // Pure black + credits roll
      fadeIn = 0;
      zoom = 6;
      blackOverlay = 1;
    }
    if (fadeIn > 0) drawBlackhole(ctx, fadeIn, zoom);
    elEndfade.style.opacity = blackOverlay;
    // Credits visibility + scroll
    if (sub === 2) {
      if (!elCredits._rolling) {
        elCredits._rolling = true;
        // Reset, then animate after a tick.
        elCreditsInner.style.transition = "none";
        elCreditsInner.style.transform = "translateX(-50%) translateY(0)";
        // Force reflow so the next transition takes hold
        void elCreditsInner.offsetHeight;
        elCreditsInner.style.transition = "transform " + (end.creditsScrollMs / 1000) + "s linear";
        const total = elCreditsInner.scrollHeight + window.innerHeight * 0.4;
        elCreditsInner.style.transform = "translateX(-50%) translateY(-" + total + "px)";
        elCredits.style.opacity = 1;
      }
    } else {
      if (elCredits._rolling) {
        elCredits._rolling = false;
        elCredits.style.opacity = 0;
      }
    }
  } else if (elCredits._rolling) {
    elCredits._rolling = false;
    elCredits.style.opacity = 0;
  }

  perfCheck(dt);
  requestAnimationFrame(frame);
}

function spawnMigrators() {
  const M = bookMetrics();
  const lx = cx - M.pw * 0.5, rx = cx + M.pw * 0.5;
  for (let i = 0; i < 150; i++) {
    migrators.push({
      x0: lx + (Math.random() - 0.5) * M.pw * 0.6,
      y0: cy + (Math.random() - 0.5) * M.bh * 0.5,
      x1: rx + (Math.random() - 0.5) * M.pw * 0.6,
      y1: cy + (Math.random() - 0.5) * M.bh * 0.5,
      arc: 30 + Math.random() * 60,
      age: -Math.random() * 250, life: SC.book.shapeshiftMs * (0.7 + Math.random() * 0.4)
    });
  }
}

function perfCheck(dt) {
  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 1000) {
    const fps = fpsFrames / (fpsAcc / 1000);
    if (fps < 50 && particles.length > 900) particles.length = Math.floor(particles.length * 0.9);
    fpsAcc = 0; fpsFrames = 0;
  }
}

// ============================================================
// Book covers — local override for #1, fallback chain for rest.
// ============================================================
const coverCards = [];
function buildCovers() {
  CONFIG.text.books.forEach((bk) => {
    const card = document.createElement("div");
    card.className = "cover";
    const frame = document.createElement("div");
    frame.className = "cover-frame";
    const img = document.createElement("img");
    img.alt = bk.title;
    const fb = document.createElement("div");
    fb.className = "cover-fallback";
    fb.innerHTML = '<div class="fb-title">' + bk.title +
      '</div><div class="fb-author">' + bk.author + '</div>';
    frame.appendChild(img); frame.appendChild(fb);
    if (bk.tag) {
      const tag = document.createElement("div");
      tag.className = "tag"; tag.textContent = bk.tag;
      frame.appendChild(tag);
    }
    const meta = document.createElement("div");
    meta.className = "cover-meta";
    meta.innerHTML = '<div class="c-title">' + bk.title +
      '</div><div class="c-author">' + bk.author + '</div>';
    card.appendChild(frame); card.appendChild(meta);
    elCovers.appendChild(card);
    coverCards.push(card);
    loadCover(img, fb, bk);
  });
}
function loadCover(img, fb, bk) {
  const showFallback = () => { img.style.display = "none"; fb.style.display = "flex"; };
  if (bk.src) {
    img.onerror = showFallback;
    img.onload = () => { if (img.naturalWidth <= 2) showFallback(); };
    img.src = bk.src;
    return;
  }
  const sources = [
    "https://covers.openlibrary.org/b/isbn/" + bk.isbn + "-L.jpg?default=false",
    "https://covers.openlibrary.org/b/isbn/" + bk.isbn + "-M.jpg?default=false"
  ];
  let idx = 0;
  const tryGoogle = () => {
    fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:" + bk.isbn)
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((d) => {
        const vi = d && d.items && d.items[0] && d.items[0].volumeInfo;
        const lk = vi && vi.imageLinks;
        const u = lk && (lk.thumbnail || lk.smallThumbnail);
        if (!u) return showFallback();
        img.onerror = showFallback; img.onload = null;
        img.src = u.replace("&zoom=1", "&zoom=2").replace("http://", "https://");
      })
      .catch(showFallback);
  };
  const next = () => { idx < sources.length ? (img.src = sources[idx++]) : tryGoogle(); };
  img.onerror = next;
  img.onload = () => { if (img.naturalWidth <= 2) next(); };
  next();
}

// ============================================================
// Presenter controls
// ============================================================
window.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === "ArrowDown" || k === "ArrowRight" || k === " " || k === "Enter") { e.preventDefault(); advance(); }
  else if (k === "ArrowUp" || k === "ArrowLeft" || k === "Backspace") { e.preventDefault(); back(); }
  else if (k === "p" || k === "P") { paused = !paused; document.body.classList.toggle("paused", paused); }
  else if (k === "r" || k === "R") { restart(); }
});
window.addEventListener("click", () => advance());
let wheelLock = 0;
window.addEventListener("wheel", (e) => {
  const now = performance.now();
  if (now - wheelLock < 700 || Math.abs(e.deltaY) < 6) return;
  wheelLock = now;
  e.deltaY > 0 ? advance() : back();
}, { passive: true });

// ============================================================
// Boot + resize
// ============================================================
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cx = W / 2; cy = H / 2;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!particles.length) buildParticles();
  if (three) { three.renderer.setSize(W, H); three.camera.aspect = W / H; three.camera.updateProjectionMatrix(); }
  layoutPageText();
}
window.addEventListener("resize", resize);

resize();
buildText();
buildCovers();
updateUI();
requestAnimationFrame(frame);
</script>
</body>
</html>
